<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyHouse</title>
<style>
/* TinyHouse remote panel. Laid out after Serum 2: three oscillators with 3D
 * wavetable displays across the top, then tabs for the filters, the envelopes,
 * the effects rack and the globals. Dark, flat, one green.
 *
 * Every control is built from the module's own chain_params (range, options,
 * default), so a parameter the module declares cannot be missing from here:
 * anything the layout below does not place lands in "More" on the Globals tab.
 * Values carry real units (Hz, ms, dB) only where the engine's mapping is known
 * and mirrored in FMT; the rest read as the raw 0..127 pot. */
:root{
  --bg:#0a0b0c; --panel:#101213; --line:#1c1f21; --line2:#272b2e;
  --txt:#d2d8d3; --dim:#9aa39d; --faint:#7b847e;
  --g:#5be584; --g2:#2f8f50; --g3:#173d27; --hi:#d9ffe4;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font:12px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1680px; margin:0 auto; padding:14px 16px 36px}

/* ---- header + tabs ---- */
#top{display:flex; align-items:center; gap:18px; padding:2px 2px 12px}
#top .brand{font-size:12px; letter-spacing:.42em; font-weight:700; color:var(--hi)}
#top .brand i{font-style:normal; color:var(--g)}
#top .hint{margin-left:auto; color:var(--faint); font-size:10px; letter-spacing:.08em}
#tabs{display:flex; gap:2px; margin:14px 0 10px; border-bottom:1px solid var(--line)}
#tabs button{
  background:none; border:0; border-bottom:2px solid transparent; color:var(--dim);
  font:inherit; letter-spacing:.2em; text-transform:uppercase; font-size:10px;
  padding:8px 16px 9px; cursor:pointer; margin-bottom:-1px;
}
#tabs button:hover{color:var(--txt)}
#tabs button.on{color:var(--g); border-bottom-color:var(--g)}
.page{display:none}
.page.on{display:block}

/* ---- layout ---- */
.grid{display:grid; gap:10px; align-items:start}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gfx{display:block; column-width:360px; column-gap:10px}
.gfx > .panel{break-inside:avoid; margin-bottom:10px}
/* Narrower windows: the three oscillators stay side by side (smaller knobs, shorter waterfalls)
 * while the other pages drop to two columns. Under 700px the oscillators become one panel at a
 * time behind a 1/2/3 switch, and everything else is a single column. */
.seg.oscsel{display:none; margin:0 0 10px}
@media (max-width:1100px){
  :root{--kw:48px; --ks:32px}
  .g3:not(#osc),.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap{padding:10px 10px 28px}
  .grid,.gfx{gap:8px}
  .panel > .head{padding:6px 9px 5px; min-height:30px}
  .panel > .body{padding:8px 9px 10px; gap:8px}
  #osc canvas.gr{height:150px !important}
  .knob .lab{font-size:9px}
  .gfx{column-width:300px}
}
@media (max-width:900px){
  :root{--kw:42px; --ks:28px}
  #osc canvas.gr{height:110px !important}
  .row > .fld{margin:6px 4px 0 0}
  .panel > .head .pick select{max-width:110px}
}
@media (max-width:700px){
  .g3,.g2,#osc{grid-template-columns:minmax(0,1fr)}
  :root{--kw:56px; --ks:36px}
  .knob .lab{font-size:10px}
  #osc canvas.gr{height:140px !important}
  .seg.oscsel{display:inline-flex}
  #osc .panel:not(.sel){display:none}
  #top{flex-wrap:wrap; gap:8px 12px}
  #top .hint{display:none}
  #pbar{margin-left:0; flex:1 1 100%}
  #pbar .cur{flex:1; width:auto}
  #tabs{overflow-x:auto}
  #tabs button{padding:8px 11px 9px; letter-spacing:.14em; white-space:nowrap}
  #browser{grid-template-columns:120px 1fr}
  #browser .list div{padding:6px 10px}
  #browser .banks div{padding:7px 9px}
}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:6px; min-width:0}
.panel > .head{
  display:flex; align-items:center; gap:10px; padding:8px 12px 7px;
  border-bottom:1px solid var(--line); min-height:34px;
}
.panel > .head .ttl{font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim)}
.panel > .head .pick{margin-left:auto; display:flex; gap:6px; min-width:0}
.panel > .head .pick select{max-width:170px}
.panel > .body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:10px}
.fxoff{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; align-items:flex-start}
.fxoff:empty{display:none}
.fxoff:not(:empty)::before{content:"Bypassed"; flex:1 0 100%; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin-top:6px}
.fxoff > .panel{width:230px; margin:0; column-span:none}
.panel .chev{display:none}
.panel.fx > .head{cursor:default}
.panel.fx.collapsed > .head,.panel.fx.peek > .head{cursor:pointer}
.panel.fx.collapsed > .head{border-bottom-color:transparent}
.panel.fx.peek .chev{transform:rotate(45deg)}
.panel.fx.collapsed > .head:hover .ttl{color:var(--txt)}
.panel.fx.collapsed > .head .ttl{color:var(--faint)}
.panel.fx.collapsed > .body{display:none}
.panel.fx.collapsed .chev,.panel.fx.peek .chev{display:block}
.panel .chev{margin-left:auto; width:6px; height:6px; border-right:1.5px solid var(--faint); border-bottom:1.5px solid var(--faint); transform:rotate(-45deg); margin-right:4px}
.row{display:flex; flex-wrap:wrap; gap:8px 2px; align-items:flex-start}
.row > .fld{margin:6px 6px 0 0}
.row > .tg{margin:14px 8px 0 0}
.sub{font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin:2px 0 -4px}
.cols{display:flex; gap:14px; flex-wrap:wrap}
.cols > *{min-width:0}

/* ---- knob ---- */
.knob{width:var(--kw,60px); text-align:center; flex:none; user-select:none}
.knob svg{display:block; margin:0 auto; cursor:ns-resize; touch-action:none; width:var(--ks,40px); height:var(--ks,40px)}
.knob .lab{color:var(--dim); font-size:10px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.knob .val{color:#7e8a82; font-size:10px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:13px}
.knob:hover .val,.knob.live .val{color:var(--g)}
.knob:hover .lab{color:var(--txt)}

/* ---- enum controls ---- */
.fld{display:flex; flex-direction:column; gap:3px; min-width:0}
.fld > .lab{color:var(--dim); font-size:10px}
select{
  appearance:none; -webkit-appearance:none; background:#0c0e0f; color:var(--g);
  border:1px solid var(--line2); border-radius:4px; padding:3px 22px 3px 8px; font:inherit; font-size:11px;
  cursor:pointer; min-width:0; text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%; background-size:4px 4px,4px 4px; background-repeat:no-repeat;
}
select:hover{border-color:var(--g2)}
select:focus{outline:none; border-color:var(--g)}
.seg{display:inline-flex; border:1px solid var(--line2); border-radius:4px; overflow:hidden}
.seg button{
  background:none; border:0; border-right:1px solid var(--line2); color:var(--dim); font:inherit; font-size:10px;
  padding:3px 8px; cursor:pointer; white-space:nowrap;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--g3); color:var(--g)}
.pw{
  width:26px; height:14px; border-radius:7px; background:#1a1d1f; border:1px solid var(--line2);
  position:relative; cursor:pointer; flex:none; padding:0;
}
.pw::after{content:""; position:absolute; top:2px; left:2px; width:8px; height:8px; border-radius:50%; background:var(--faint); transition:left .1s,background .1s}
.pw.on{background:var(--g3); border-color:var(--g2)}
.pw.on::after{left:14px; background:var(--g)}
.tg{display:flex; align-items:center; gap:7px; color:var(--dim); font-size:10px}

/* ---- graphs ---- */
canvas.gr{display:block; width:100%; background:#080909; border:1px solid var(--line); border-radius:4px; touch-action:none}
canvas.gr.drag{cursor:crosshair}
.cap{display:flex; justify-content:space-between; color:var(--faint); font-size:9px; letter-spacing:.08em; margin-top:-6px}
.cap b{color:var(--dim); font-weight:500}
.note{color:var(--faint); font-size:10px}
.band.hot .knob .lab{color:var(--g)}
.err{color:#e58a5b; padding:30px; font-size:13px}

/* ---- preset bar and browser ---- */
#pbar{display:none; align-items:center; gap:4px; margin-left:8px}
#pbar.on{display:flex}
#pbar button{
  background:#0c0e0f; border:1px solid var(--line2); color:var(--dim); font:inherit; cursor:pointer;
  height:28px; min-width:28px; border-radius:4px; padding:0 8px;
}
#pbar button:hover{color:var(--g); border-color:var(--g2)}
#pbar .cur{
  display:flex; align-items:baseline; gap:10px; width:min(46vw,460px); height:28px; padding:0 14px;
  background:#0c0e0f; border:1px solid var(--line2); border-radius:4px; cursor:pointer; overflow:hidden; white-space:nowrap;
}
#pbar .cur:hover,#pbar .cur.open{border-color:var(--g2)}
#pbar .cur .bk{color:var(--dim); font-size:10px; letter-spacing:.14em; text-transform:uppercase; align-self:center}
#pbar .cur .nm{color:var(--hi); font-size:13px; overflow:hidden; text-overflow:ellipsis; align-self:center}
#pbar .cnt{color:var(--faint); font-size:10px; font-variant-numeric:tabular-nums; margin-left:6px; min-width:58px}
#browser{
  display:none; position:fixed; z-index:20; left:50%; top:52px; transform:translateX(-50%);
  width:min(900px,calc(100vw - 24px)); height:min(560px,calc(100vh - 80px));
  background:var(--panel); border:1px solid var(--line2); border-radius:8px; box-shadow:0 18px 60px rgba(0,0,0,.7);
  grid-template-columns:200px 1fr; grid-template-rows:auto 1fr; overflow:hidden;
}
#browser.on{display:grid}
#browser .bhead{grid-column:1 / -1; display:flex; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line)}
#browser .bhead input{
  flex:1; background:#0a0c0d; border:1px solid var(--line2); border-radius:4px; color:var(--hi);
  font:inherit; font-size:13px; padding:6px 10px;
}
#browser .bhead input:focus{outline:none; border-color:var(--g)}
#browser .bhead .x{background:none; border:0; color:var(--dim); font-size:16px; cursor:pointer}
#browser .banks{border-right:1px solid var(--line); overflow:auto; padding:6px 0}
#browser .banks div{display:flex; justify-content:space-between; gap:8px; padding:7px 14px; cursor:pointer; color:var(--dim)}
#browser .banks div:hover{color:var(--txt); background:#14171a}
#browser .banks div.on{color:var(--g); background:var(--g3)}
#browser .banks small{color:var(--faint)}
#browser .list{overflow:auto; padding:6px 0}
#browser .list div{display:flex; gap:12px; padding:6px 16px; cursor:pointer; color:var(--txt); white-space:nowrap}
#browser .list div:hover,#browser .list div.sel{background:#14171a}
#browser .list div.cur{color:var(--g)}
#browser .list div.cur::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--g); align-self:center; margin-left:-10px; margin-right:5px}
#browser .list small{color:var(--faint); margin-left:auto; font-size:10px; letter-spacing:.1em; text-transform:uppercase}
#browser .empty{padding:24px; color:var(--faint)}

/* ---- demo mode ---- */
.demo-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0}
.demo-note{color:var(--faint); font-size:11px; margin-bottom:4px}
.demo-stat{color:var(--dim); font-size:12px; margin-top:6px}
.demo-notes{color:var(--faint); font-size:11px; margin-top:8px; white-space:pre-wrap}
.demo-sum{color:var(--hi); margin:6px 0 4px}
.demo-h{color:var(--dim); letter-spacing:.16em; text-transform:uppercase; font-size:10px; margin:14px 0 4px}
.demo-on,.demo-b,.demo-go,.demo-sel,.demo-name{background:#0c0e0f; border:1px solid var(--line2); color:var(--txt); font:inherit; font-size:12px; padding:7px 14px; border-radius:4px}
.demo-on,.demo-b,.demo-go{cursor:pointer}
.demo-on.on{background:var(--g3); border-color:var(--g2); color:var(--hi)}
.demo-b:hover,.demo-on:hover{color:var(--g); border-color:var(--g2)}
.demo-go{background:var(--g3); border-color:var(--g2); color:var(--hi); margin-top:12px; min-width:110px}
.demo-go:disabled,.demo-on:disabled{opacity:.4; cursor:default}
.demo-sel{max-width:100%}
.demo-name{width:100%; color:var(--hi); font-size:13px; padding:6px 10px}
.demo-drop{border:1px dashed var(--line2); border-radius:6px; padding:16px; text-align:center; color:var(--faint); margin:8px 0}
.demo-drop.over{border-color:var(--g); color:var(--g)}

/* ---- import dialog ---- */
#browser .bhead .imp{background:#0c0e0f; border:1px solid var(--line2); color:var(--dim); font:inherit; font-size:11px; letter-spacing:.06em; cursor:pointer; height:28px; padding:0 12px; border-radius:4px; white-space:nowrap}
#browser .bhead .imp:hover{color:var(--g); border-color:var(--g2)}
#imp{
  display:none; position:fixed; z-index:30; left:50%; top:48px; transform:translateX(-50%);
  width:min(640px,calc(100vw - 24px)); max-height:calc(100vh - 72px); flex-direction:column;
  background:var(--panel); border:1px solid var(--line2); border-radius:8px; box-shadow:0 18px 60px rgba(0,0,0,.75); overflow:hidden;
}
#imp.on{display:flex}
#imp .imp-head{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); color:var(--hi); letter-spacing:.16em; text-transform:uppercase; font-size:11px}
#imp .imp-head .x{background:none; border:0; color:var(--dim); font-size:16px; cursor:pointer}
#imp .imp-body{padding:14px 16px 18px; overflow:auto; flex:1 1 auto; min-height:0}
#imp .imp-intro{color:var(--dim); font-size:12px; margin-bottom:12px}
#imp .imp-row{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0}
#imp .imp-b,#imp .imp-go{background:#0c0e0f; border:1px solid var(--line2); color:var(--txt); font:inherit; font-size:12px; cursor:pointer; padding:7px 14px; border-radius:4px}
#imp .imp-b:hover{color:var(--g); border-color:var(--g2)}
#imp .imp-go{background:var(--g3); border-color:var(--g2); color:var(--hi); margin-top:12px; min-width:110px}
#imp .imp-go:disabled{opacity:.4; cursor:default}
#imp .imp-drop{border:1px dashed var(--line2); border-radius:6px; padding:16px; text-align:center; color:var(--faint); margin:8px 0}
#imp .imp-drop.over{border-color:var(--g); color:var(--g)}
#imp .imp-sum{color:var(--hi); margin:6px 0 4px}
#imp .imp-h{color:var(--dim); letter-spacing:.16em; text-transform:uppercase; font-size:10px; margin:16px 0 4px}
#imp .imp-note{color:var(--faint); font-size:11px; margin-bottom:4px}
#imp .imp-src label{display:flex; gap:8px; align-items:center; color:var(--txt); padding:3px 0; cursor:pointer}
#imp .imp-name{width:100%; background:#0a0c0d; border:1px solid var(--line2); border-radius:4px; color:var(--hi); font:inherit; font-size:13px; padding:6px 10px}
#imp .imp-name:focus{outline:none; border-color:var(--g)}
#imp .imp-bar{height:4px; background:var(--line); border-radius:2px; margin-top:12px; overflow:hidden}
#imp .imp-bar i{display:block; height:100%; width:0; background:var(--g); transition:width .25s}
#imp .imp-stat{color:var(--dim); font-size:11px; margin-top:6px; min-height:15px}
#imp .rep-head{color:var(--txt); font-size:13px; margin-bottom:8px} #imp .rep-head b{color:var(--g)}
#imp .rep-warn{color:#e5b45b; margin:6px 0}
#imp .rep-sub,#imp .rep-line{color:var(--dim); margin:4px 0}
#imp .rep-note{color:var(--faint); font-size:11px; margin:14px 0 4px}
#imp .rep-g{border:1px solid var(--line); border-radius:6px; margin:8px 0; background:#0c0e0f}
#imp .rep-g summary{cursor:pointer; padding:7px 12px; color:var(--txt)}
#imp .rep-g.bad summary{color:#e58a5b} #imp .rep-g.ok summary{color:var(--g)}
#imp .rep-p{padding:4px 12px 6px; border-top:1px solid var(--line)}
#imp .rep-p .nm{color:var(--hi)}
#imp .rep-p .gap{color:var(--faint); font-size:11px; padding-left:12px}
</style>
</head>
<body>
<div class="wrap">
  <div id="top"><div class="brand">TINY<i>HOUSE</i></div><div id="pbar"></div><div class="hint" id="hint">connecting…</div></div>
  <div id="browser"></div>
  <div id="imp"></div>
  <div id="osc" class="grid g3"></div>
  <div id="tabs"></div>
  <div id="pages"></div>
</div>

<script type="text/plain" id="impworker">
/* The converter's Python runs here, off the page's thread, so the page stays alive while a bank converts. */
var py = null;
function say(id, text) { self.postMessage({ id: id, progress: text }); }
function ensureDir(path) {
  var parts = path.split("/"), cur = "";
  for (var i = 0; i < parts.length - 1; i++) {
    cur += (i ? "/" : "") + parts[i];
    if (cur && !py.FS.analyzePath("/in/" + cur).exists) py.FS.mkdirTree("/in/" + cur);
  }
}
self.onmessage = async function (e) {
  var m = e.data, id = m.id;
  try {
    var out = null, transfer = [];
    if (m.cmd === "init") {
      say(id, "Loading Python (first time only, about 10 MB)…");
      importScripts(m.base + "pyodide.js");
      py = await loadPyodide({ indexURL: m.base });
      say(id, "Loading numpy…");
      await py.loadPackage(["numpy", "zstandard"]);
      py.FS.writeFile("/b.zip", new Uint8Array(m.bundle));
      py.runPython("import zipfile, sys\nzipfile.ZipFile('/b.zip').extractall('/imp')\nsys.path.insert(0, '/imp')\nimport import_web");
      py.FS.mkdirTree("/in");
    } else if (m.cmd === "add") {
      for (var i = 0; i < m.files.length; i++) {
        var f = m.files[i];
        ensureDir(f.path);
        py.FS.writeFile("/in/" + f.path, new Uint8Array(f.buf));
      }
      out = py.runPython("import_web.add_dir('/in')");
    } else if (m.cmd === "addraw") {                       /* files for Serum's Samples / Multisamples layout under /smp (decoded audio is "<name>.dec") */
      for (var j = 0; j < m.files.length; j++) {
        var g = m.files[j], dir = "/smp/" + g.path.split("/").slice(0, -1).join("/");
        py.FS.mkdirTree(dir);
        py.FS.writeFile("/smp/" + g.path, new Uint8Array(g.buf));
      }
    } else if (m.cmd === "sfz") {
      py.globals.set("_rels", JSON.stringify(m.rels));
      out = py.runPython("import_web.sfz_audio_json(_rels)");
    } else if (m.cmd === "getsamples") {                  /* the sample sets written since the last call, as files */
      var list = JSON.parse(py.runPython("import_web.new_sample_files_json()")), got = {}, tr = [];
      for (var q = 0; q < list.length; q++) {
        var data = py.FS.readFile(list[q][1]), ab = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
        got[list[q][0]] = ab; tr.push(ab);
        py.FS.unlink(list[q][1]);
      }
      out = got; transfer = tr;
    } else if (m.cmd === "names") {
      out = JSON.parse(py.runPython("import_web.names_json()"));
    } else if (m.cmd === "convert") {
      py.globals.set("_bank", m.bank);
      py.globals.set("_only", m.only ? JSON.stringify(m.only) : "");
      out = py.runPython("import_web.convert_json(_bank, _only)");
    } else if (m.cmd === "reset") {
      py.runPython("import_web.reset()");
    }
    self.postMessage({ id: id, ok: true, result: out }, transfer);
  } catch (err) {
    self.postMessage({ id: id, ok: false, error: String(err && err.message || err).slice(0, 400) });
  }
};
</script>
<script src="/static/schwung-remote-api.js"></script>
<script>
(function () {
"use strict";

var KP = "synth:";
var META = {};            /* key -> chain_params entry */
var VAL = {};             /* key -> number (enums: option index) */
var SUBS = {};            /* key -> [fn(value)] */
var placed = {};
var graphs = [];

/* ------------------------------------------------------------------ dom */
function el(tag, cls, parent, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function svgNode(parent, tag, attrs) {
  var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var a in attrs) n.setAttribute(a, attrs[a]);
  parent.appendChild(n);
  return n;
}

/* ---------------------------------------------------------------- values */
function send(key, v) {
  try { schwungRemote.setParam(KP + key, String(v)); } catch (e) {}
}
function clampTo(m, v) {
  if (!m) return v;
  if (m.type === "int") return Math.max(m.min, Math.min(m.max, Math.round(v)));
  if (m.type === "enum") return Math.max(0, Math.min(m.options.length - 1, Math.round(v)));
  return v;
}
function setVal(key, v, push) {
  var m = META[key];
  v = clampTo(m, v);
  if (VAL[key] === v) return;
  VAL[key] = v;
  var s = SUBS[key];

/* ---- preset browser -------------------------------------------------------
 * The module publishes every bank with its preset names (preset_list) and the one the Move is on
 * (preset_now, "bank,index"). Loading is the module's own: "bank" switches the bank and plays its
 * first sound, "preset" is the index inside the bank. A load changes hundreds of values at once and
 * the host only streams values it is told changed, so after a load the panel asks the host to
 * resubscribe and reads everything again. */
var PS = { banks: [], b: 0, i: 0, shown: [], sel: 0, q: "", viewBank: 0 };
var pbarEl = null, brEl = null, brSearch = null, brBanks = null, brList = null, curEl = null, cntEl = null;

function psFlat() {
  var n = 0;
  for (var b = 0; b < PS.b; b++) n += PS.banks[b].p.length;
  return n + PS.i;
}
function psTotal() { return PS.banks.reduce(function (s, b) { return s + b.p.length; }, 0); }
function psName() {
  var b = PS.banks[PS.b];
  return b && b.p[PS.i] !== undefined ? b.p[PS.i] : "";
}

var reloadTimer = null;
function reseed() {
  Object.keys(META).forEach(function (k) {
    if (META[k].type === "filepath") return;
    schwungRemote.getParam(KP + k).then(function (v) { if (v !== undefined && v !== null && v !== "") incoming(k, v); }).catch(function () {});
  });
}
function afterLoad() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(function () {
    if (schwungRemote.resubscribe) { try { schwungRemote.resubscribe(); } catch (e) {} }
    setTimeout(reseed, 700);
  }, 500);
}
function loadPreset(b, i) {
  if (!PS.banks[b] || PS.banks[b].p[i] === undefined) return;
  if (b !== PS.b) {
    send("bank", b);                       /* switches the bank and plays its first sound */
    PS.b = b; PS.i = 0;
    if (i !== 0) setTimeout(function () { send("preset", i); }, 150);
    else send("preset", 0);
  } else send("preset", i);
  PS.i = i;
  renderPbar(); renderBrowser();
  afterLoad();
}
function stepPreset(d) {
  var tot = psTotal();
  if (!tot) return;
  var f = ((psFlat() + d) % tot + tot) % tot;
  for (var b = 0; b < PS.banks.length; b++) {
    if (f < PS.banks[b].p.length) { loadPreset(b, f); return; }
    f -= PS.banks[b].p.length;
  }
}

function renderPbar() {
  if (!pbarEl) return;
  var have = PS.banks.length > 0;
  pbarEl.classList.toggle("on", have);
  if (!have) return;
  curEl.querySelector(".bk").textContent = PS.banks[PS.b] ? PS.banks[PS.b].n : "";
  curEl.querySelector(".nm").textContent = psName() || "-";
  cntEl.textContent = (psFlat() + 1) + " / " + psTotal();
}

function renderBrowser() {
  if (!brEl || !brEl.classList.contains("on")) return;
  var q = PS.q.trim().toLowerCase();
  brBanks.textContent = "";
  PS.banks.forEach(function (b, bi) {
    var d = el("div", bi === PS.viewBank && !q ? "on" : "", brBanks);
    el("span", null, d, b.n); el("small", null, d, String(b.p.length));
    d.addEventListener("click", function () { PS.viewBank = bi; PS.q = ""; brSearch.value = ""; PS.sel = 0; renderBrowser(); });
  });
  var rows = [];
  PS.banks.forEach(function (b, bi) {
    if (!q && bi !== PS.viewBank) return;
    b.p.forEach(function (n, i) {
      if (!q || n.toLowerCase().indexOf(q) >= 0 || b.n.toLowerCase().indexOf(q) >= 0) rows.push({ b: bi, i: i, n: n, bank: b.n });
    });
  });
  PS.shown = rows;
  if (PS.sel >= rows.length) PS.sel = Math.max(0, rows.length - 1);
  brList.textContent = "";
  if (!rows.length) { el("div", "empty", brList, "No presets match."); return; }
  rows.forEach(function (r, k) {
    var d = el("div", (r.b === PS.b && r.i === PS.i ? "cur " : "") + (k === PS.sel ? "sel" : ""), brList);
    el("span", null, d, r.n);
    if (q) el("small", null, d, r.bank);
    d.addEventListener("click", function () { PS.sel = k; loadPreset(r.b, r.i); });
  });
  var s = brList.querySelector(".sel") || brList.querySelector(".cur");
  if (s && s.scrollIntoView) s.scrollIntoView({ block: "nearest" });
}
function openBrowser(on) {
  if (on === undefined) on = !brEl.classList.contains("on");
  brEl.classList.toggle("on", on);
  curEl.classList.toggle("open", on);
  if (on) {
    PS.viewBank = PS.b; PS.q = ""; brSearch.value = ""; PS.sel = 0;
    renderBrowser();
    var cur = brList.querySelector(".cur");
    PS.sel = Math.max(0, PS.shown.findIndex(function (r) { return r.b === PS.b && r.i === PS.i; }));
    renderBrowser();
    brSearch.focus(); brSearch.select();
  }
}

/* ---- import Serum 2 presets ------------------------------------------------
 * The preset browser's Import button. Presets (.SerumPreset), packs (.SerumPack) or a folder of either are converted in the browser by the
 * same Python the desktop converter is (Pyodide, in a worker; the bundle of its files is read from the module's folder on the Move), then
 * uploaded through the Move's own file manager into a bank: loose presets go to "Imports", a folder or pack to a bank of its own name.
 * Nothing is measured against Serum here, so reverb, width and loudness are the converter's laws, not fits; whatever the engine cannot
 * carry is listed when the import is done. */
var PYO = "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/";
var MOVE_BUNDLE = "/data/UserData/schwung/modules/sound_generators/tinyhouse/import_bundle.zip";
var PRESET_ROOT = "/data/UserData/schwung/presets/tinyhouse";
var IMP = { box: null, presets: [], wavs: [], tables: [], smps: [], bankTouched: false, busy: false, worker: null, ready: null, rpc: {}, seq: 0, bankEl: null, sumEl: null, goEl: null, statEl: null, bodyEl: null };

function impCall(cmd, data, transfer, onProgress) {
  return new Promise(function (resolve, reject) {
    var id = ++IMP.seq;
    IMP.rpc[id] = { resolve: resolve, reject: reject, onProgress: onProgress };
    var msg = { id: id, cmd: cmd };
    for (var k in data) msg[k] = data[k];
    IMP.worker.postMessage(msg, transfer || []);
  });
}
function impStart(onProgress) {
  if (IMP.ready) return IMP.ready;
  IMP.ready = (async function () {
    var r = await fetch("import_bundle.zip").catch(function () { return { ok: false }; });      /* beside this page: the module's folder */
    if (!r.ok) r = await fetch("/files/download?path=" + encodeURIComponent(MOVE_BUNDLE));

/* ---- the report ---- */
function impReport(bank, list, sent, failed, landed, existed) {
  var body = IMP.bodyEl; body.textContent = "";
  var ok = list.filter(function (p) { return p.json && sent[p.file]; });
  var bad = list.filter(function (p) { return !p.json || !sent[p.file]; });
  function lines(p) {
    var out = p.gaps.map(function (g) { return g; });
    p.not_carried.forEach(function (g) { out.push(/not carried|not imported/.test(g) ? g : g + " not carried"); });
    p.missing_tables.forEach(function (t) { out.push("Wavetable not found: " + t + " (the Init table plays instead)"); });
    p.missing_samples.forEach(function (t) { out.push("Sample not found: " + t + " (that oscillator stays silent)"); });
    return out;
  }
  var whole = ok.filter(function (p) { return !lines(p).length; });
  var part = ok.filter(function (p) { return lines(p).length; });
  var head = el("div", "rep-head", body);
  el("b", null, head, "Imported " + ok.length + " of " + list.length + (list.length === 1 ? " preset" : " presets"));

  if (!landed && ok.length) el("div", "rep-warn", body, "The Move has not listed them yet. Reload the slot, or press the Move's preset browser once, and they will appear in the bank “" + bank + "”.");
  var tally = {};
  part.forEach(function (p) { lines(p).forEach(function (l) { var k = l.replace(/^Wavetable not found:.*/, "Wavetable not found").replace(/^Sample not found:.*/, "Sample not found").replace(/^Oscillator [ABC]: /, "Oscillator: ").replace(/ \(.*\)$/, ""); tally[k] = (tally[k] || 0) + 1; }); });
  var tk = Object.keys(tally).sort(function (a, b) { return tally[b] - tally[a]; }).slice(0, 6);
  if (tk.length) el("div", "rep-sub", body, "Most common gaps: " + tk.map(function (k) { return k + " ×" + tally[k]; }).join(" · "));

  group("Imported complete", whole, "ok", function () { return []; });
  group("Not imported", bad, "bad", function (p) { return [p.error || "Could not be sent to the Move"]; });
  if (failed.length) group("Upload problems", [{ name: "Files that did not reach the Move", f: failed }], "bad", function (p) { return p.f; });
  el("div", "rep-note", body, "Loudness, reverb and width are set by general rules, not matched to Serum (that needs Serum to measure): set Volume and the effects to taste. Granular oscillators are left silent, and Sample oscillators too unless you chose the Samples folders.");
  var again = el("button", "imp-go", body, "Import more");
  again.addEventListener("click", function () { IMP.presets = []; IMP.bankTouched = false; impBuildForm(); impSummary(); });
  impStatus("Done.");

}

/* ---------------------------------------------------------------- demo mode */
/* Play a MIDI part of a song on this slot: bass on one slot, lead on another, switched on in step. The MIDI files are read here (a Standard MIDI File is simple), cut
 * into parts (one per track, or per channel when a track has several), and stored on the Move as .tdm text: "len|tick,dur,note,vel|..." in 1/96 beats. Every part of one
 * song gets the same length (whole bars), so the parts stay together whenever each is switched on. */
var MIDI_ROOT = "/data/UserData/schwung/midi";
var DM = { packs: [], b: 0, p: 0, on: false, playing: false, files: [], busy: false, ui: {} };

function parseMidi(buf) {
  var u = new Uint8Array(buf), d = new DataView(buf);
  function tag(o) { return String.fromCharCode(u[o], u[o + 1], u[o + 2], u[o + 3]); }
  if (u.length < 14 || tag(0) !== "MThd") throw new Error("not a MIDI file");
  var hl = d.getUint32(4), ntr = d.getUint16(10), div = d.getUint16(12);
  if (div & 0x8000) throw new Error("SMPTE time code is not supported");
  var pos = 8 + hl, tracks = [], tempo = null, sig = null;
  function vlq(p) { var v = 0, b; do { b = u[p.i++]; v = (v << 7) | (b & 0x7f); } while ((b & 0x80) && p.i < u.length); return v; }
  for (var t = 0; t < ntr && pos + 8 <= u.length; t++) {
    var len = d.getUint32(pos + 4);
    if (tag(pos) !== "MTrk") { pos += 8 + len; t--; continue; }
    var p = { i: pos + 8 }, end = Math.min(pos + 8 + len, u.length), abs = 0, run = 0, name = "", open = {}, notes = [];
    function close(key, at) { var o = open[key]; if (o) { notes.push({ t: o.t, d: Math.max(at - o.t, 1), n: o.n, v: o.v, c: o.c }); delete open[key]; } }
    while (p.i < end) {
      abs += vlq(p);
      var st = u[p.i];
      if (st === 0xFF) {
        var type = u[p.i + 1]; p.i += 2;
        var l = vlq(p);
        if (type === 0x03 && !name) name = String.fromCharCode.apply(null, Array.prototype.slice.call(u, p.i, p.i + l)).replace(/[^\x20-\x7e]/g, "").trim();
        else if (type === 0x51 && l === 3 && tempo === null) tempo = 60000000 / ((u[p.i] << 16) | (u[p.i + 1] << 8) | u[p.i + 2]);
        else if (type === 0x58 && l >= 2 && !sig) sig = [u[p.i], 1 << u[p.i + 1]];
        p.i += l;
        if (type === 0x2f) break;
        continue;
      }
      if (st === 0xF0 || st === 0xF7) { p.i++; p.i += vlq(p); continue; }
      if (st & 0x80) { run = st; p.i++; }
      var hi = run & 0xF0, ch = run & 0x0F, a = u[p.i], b2 = u[p.i + 1];
      if (hi === 0xC0 || hi === 0xD0) { p.i += 1; continue; }
      p.i += 2;
      if (hi === 0x90 && b2 > 0) { close(ch * 128 + a, abs); open[ch * 128 + a] = { t: abs, n: a, v: b2, c: ch }; }
      else if (hi === 0x80 || hi === 0x90) close(ch * 128 + a, abs);
    }
    Object.keys(open).forEach(function (k) { close(+k, abs); });
    tracks.push({ name: name, notes: notes });
    pos += 8 + len;
  }
  return { ppq: div, tracks: tracks, tempo: tempo || 120, sig: sig || [4, 4] };
}

function cleanPartName(s) {
  s = String(s || "").replace(/[^A-Za-z0-9 _.&()+#'-]/g, " ").replace(/\s+/g, " ").trim().slice(0, 60).trim();
  return s || "Part";
}

/* The parts of one parsed file: [{name, text, notes, bars}] with one shared length. */
function midiParts(base, m) {
  base = String(base).replace(/\.[^.]*$/, "");
  var q = 96 / m.ppq, raw = [], maxEnd = 0;
  m.tracks.forEach(function (tr, ti) {
    var by = {};
    tr.notes.forEach(function (n) { (by[n.c] = by[n.c] || []).push(n); });
    var chs = Object.keys(by);
    chs.forEach(function (c) {
      var ns = by[c].map(function (n) { return { t: Math.round(n.t * q), d: Math.max(1, Math.round(n.d * q)), n: n.n, v: n.v }; });
      ns.forEach(function (n) { maxEnd = Math.max(maxEnd, n.t + n.d); });
      var label = tr.name || ("Track " + (ti + 1));
      if (chs.length > 1) label += (+c === 9 ? " drums" : " ch" + (+c + 1));
      else if (+c === 9 && !tr.name) label = "Drums";
      raw.push({ label: label, ns: ns });
    });
  });
  var bar = m.sig[0] * (384 / m.sig[1]), len = Math.max(1, Math.ceil(maxEnd / bar)) * bar;
  return raw.map(function (r) {
    r.ns.sort(function (a, b) { return a.t - b.t; });
    var ns = r.ns.slice(0, 20000);
    return { name: raw.length === 1 ? cleanPartName(base) : cleanPartName(base + " - " + r.label), notes: ns.length,
             bars: len / bar, text: len + "|" + ns.map(function (n) { return n.t + "," + n.d + "," + n.n + "," + n.v; }).join("|") + "\n" };
  });
}

async function demoRun() {
  var u = DM.ui;
  if (DM.busy || !DM.files.length) return;
  DM.busy = true; demoSummary();
  var pack = cleanBank(u.name.value) || "Demos", made = [], notes = [];
  try {
    u.res.textContent = "Reading…";
    var used = {};

      var f = DM.files[i], base = f.rel.split("/").pop();

        ps.forEach(function (p) {

        });

      } catch (e) { notes.push(f.rel + ": " + e.message); }

}

  demoSummary(); demoRender();
  /* while the demo is on, ask the module whether it has started (it waits for a bar) */
  setInterval(function () {
    if (!DM.on) return;
    schwungRemote.getParam(KP + "demo_now").then(function (v) { if (v) EXTRA.demo_now(v); }).catch(function () {});
  }, 1000);
}

/* chain_params entries the module adds for the host's own pages (pack and table lists, the preset
 * browser): they are not sound parameters and have their own pickers or none here */
var NOT_CONTROLS = /^(wt_pack|wt\d_select|preset|bank|rescan|is_loading|wt_paths|demo_on|demo_pack|demo_part|demo_list|demo_now|mac[1-8]|macro_names|macro_routes)$/;

/* keys the host streams that are not controls */
var EXTRA = {
  wt_paths: function (v) { try { var a = JSON.parse(v); if (a && a.length) PATHS = a; } catch (e) {} },
  wt1_shape: function (v) { ingestShape(1, v); },
  wt2_shape: function (v) { ingestShape(2, v); },
  wt3_shape: function (v) { ingestShape(3, v); },
  preset_list: function (v) {
    try { var d = JSON.parse(v); if (d && d.b) { PS.banks = d.b; renderPbar(); renderBrowser(); } } catch (e) {}
  },
  demo_list: function (v) {
    try { var d = JSON.parse(v); if (d && d.b) { DM.packs = d.b; demoRender(); } } catch (e) {}
  },
  demo_now: function (v) {
    var p = String(v).split(","), b = parseInt(p[0], 10), i = parseInt(p[1], 10);
    if (!isNaN(b) && !isNaN(i)) { DM.b = b; DM.p = i; DM.playing = p[2] === "1"; demoRender(); }
  },
  demo_on: function (v) { DM.on = String(v).toLowerCase() === "on" || String(v) === "1"; demoRender(); },
  macro_names: function (v) { MAC.names = String(v || "").split("|"); macRender(); },
  macro_routes: function (v) {
    MAC.routes = String(v || "").split(",").map(function (t) { var a = t.split(":"); return { m: parseInt(a[0], 10), k: a[1] }; }).filter(function (r) { return r.k; });
  },
  preset_now: function (v) {
    var p = String(v).split(","), b = parseInt(p[0], 10), i = parseInt(p[1], 10);
    if (!isNaN(b) && !isNaN(i)) { PS.b = b; PS.i = i; renderPbar(); renderBrowser(); macReload(); }
  }
};
[1, 2, 3].forEach(function (n) {
  EXTRA["wt" + n + "_table"] = function (p) { if (p) loadShapeFromFile(n, p); };
});

/* ------------------------------------------------------------------ start */
function buildTabs() {
  var tabs = document.getElementById("tabs"), pages = document.getElementById("pages");
  var defs = [["Macros", buildMacros], ["Filter", buildFilter], ["Envelopes", buildEnv], ["FX", buildFx], ["Mix", buildMix], ["Globals", buildGlobal], ["Demo", buildDemo]];
  var ps = [], bs = [];
  defs.forEach(function (d, i) {
    var b = el("button", i ? null : "on", tabs, d[0]);
    var p = el("div", "page" + (i ? "" : " on"), pages);
    d[1](p);
    ps.push(p); bs.push(b);
    b.addEventListener("click", function () {
      ps.forEach(function (x, j) { x.classList.toggle("on", j === i); bs[j].classList.toggle("on", j === i); });
      try { localStorage.setItem("th_tab", String(i)); } catch (e) {}
      redrawSoon();
    });
  });
  try {
    var t = parseInt(localStorage.getItem("th_tab"), 10);
    if (t > 0 && t < defs.length) bs[t].click();
  } catch (e) {}
}

function start(cp) {
  cp.forEach(function (c) { if (c && c.key) META[c.key] = c; });
  buildBrowser();
  buildImport();
  buildOsc();
  buildTabs();
  buildPickers(cp);
  document.getElementById("hint").textContent = Object.keys(META).length + " parameters · live both ways";
  drawAll();

  schwungRemote.onParamChange(function (p) {
    for (var key in p) {
      if (key.indexOf(KP) !== 0) continue;
      var k = key.substring(KP.length);
      if (EXTRA[k]) EXTRA[k](p[key]);
      else if (META[k] && META[k].type !== "filepath") incoming(k, p[key]);
    }
  });
  /* seed from the host's cache, in case the first push was missed */
  Object.keys(META).forEach(function (k) {
    if (META[k].type === "filepath") return;
    schwungRemote.getParam(KP + k).then(function (v) { if (v !== undefined && v !== null && v !== "") incoming(k, v); }).catch(function () {});
  });
  Object.keys(EXTRA).forEach(function (k) {
    schwungRemote.getParam(KP + k).then(function (v) { if (v) EXTRA[k](v); }).catch(function () {});
  });
}

function fail(msg) {
  var e = el("div", "err", document.body, msg);
  document.getElementById("hint").textContent = "not connected";
}

if (!window.schwungRemote || !schwungRemote.getChainParams) fail("The Schwung remote API is not available on this page.");
else schwungRemote.getChainParams().then(start).catch(function () { fail("Could not read the module's parameters."); });
})();
</script>
