<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyHouse</title>
<style>
/* TinyHouse remote panel. Laid out after Serum 2: three oscillators with 3D
 * wavetable displays across the top, then tabs for the filters, the envelopes,
 * the effects rack and the globals. Dark, flat, one green.
 *
 * Every control is built from the module's own chain_params (range, options,
 * default), so a parameter the module declares cannot be missing from here:
 * anything the layout below does not place lands in "More" on the Globals tab.
 * Values carry real units (Hz, ms, dB) only where the engine's mapping is known
 * and mirrored in FMT; the rest read as the raw 0..127 pot. */
:root{
  --bg:#0a0b0c; --panel:#101213; --line:#1c1f21; --line2:#272b2e;
  --txt:#d2d8d3; --dim:#9aa39d; --faint:#7b847e;
  --g:#5be584; --g2:#2f8f50; --g3:#173d27; --hi:#d9ffe4;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font:12px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1680px; margin:0 auto; padding:14px 16px 36px}

/* ---- header + tabs ---- */
#top{display:flex; align-items:center; gap:18px; padding:2px 2px 12px}
#top .brand{font-size:12px; letter-spacing:.42em; font-weight:700; color:var(--hi)}
#top .brand i{font-style:normal; color:var(--g)}
#top .hint{margin-left:auto; color:var(--faint); font-size:10px; letter-spacing:.08em}
#tabs{display:flex; gap:2px; margin:6px 0 12px; border-bottom:1px solid var(--line)}
#tabs button{
  background:none; border:0; border-bottom:2px solid transparent; color:var(--dim);
  font:inherit; letter-spacing:.2em; text-transform:uppercase; font-size:10px;
  padding:8px 16px 9px; cursor:pointer; margin-bottom:-1px;
}
#tabs button:hover{color:var(--txt)}
#tabs button.on{color:var(--g); border-bottom-color:var(--g)}
.page{display:none}
.page.on{display:block}

/* ---- layout ---- */
.grid{display:grid; gap:10px; align-items:start}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
/* Narrower windows: the three oscillators stay side by side (smaller knobs, shorter waterfalls)
 * while the other pages drop to two columns. Under 700px the oscillators become one panel at a
 * time behind a 1/2/3 switch, and everything else is a single column. */
.seg.oscsel{display:none; margin:0 0 10px}
.smpnote{display:none; margin:0 0 10px; padding:6px 10px; border:1px solid var(--line2); border-radius:4px; color:var(--faint); font-size:11px; cursor:pointer}
.smpnote b{color:var(--g); font-weight:600}
.smpslot:not(.sel){display:none}
.smpslot .badge{margin-left:8px; padding:1px 7px; border-radius:9px; font-size:10px; border:1px solid var(--line2); color:var(--faint)}
.smpslot .badge.gran{color:var(--g); border-color:var(--g)}
.grainview{display:block; width:100%; height:168px; background:#0c0e0f; border:1px solid var(--line); border-radius:4px; margin:2px 0 10px; cursor:ew-resize; touch-action:none}
.smpslot .smpfile{color:var(--faint); font-size:11px; margin:2px 0 6px; word-break:break-all}
@media (max-width:1100px){
  :root{--kw:48px; --ks:32px}
  .g3:not(#osc),.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap{padding:10px 10px 28px}
  .grid{gap:8px}
  .panel > .head{padding:6px 9px 5px; min-height:30px}
  .panel > .body{padding:8px 9px 10px; gap:8px}
  #osc canvas.gr{height:150px !important}
  .knob .lab{font-size:9px}
}
@media (max-width:900px){
  :root{--kw:42px; --ks:28px}
  #osc canvas.gr{height:110px !important}
  .row > .fld{margin:6px 4px 0 0}
  .panel > .head .pick select{max-width:110px}
}
@media (max-width:700px){
  .g3,.g2,#osc{grid-template-columns:minmax(0,1fr)}
  :root{--kw:56px; --ks:36px}
  .knob .lab{font-size:10px}
  #osc canvas.gr{height:140px !important}
  .seg.oscsel{display:inline-flex}
  #osc .panel:not(.sel){display:none}
  #top{flex-wrap:wrap; gap:8px 12px}
  #top .hint{display:none}
  #pbar{margin-left:0; flex:1 1 100%}
  #pbar .cur{flex:1; width:auto}
  #tabs{overflow-x:auto}
  #tabs button{padding:8px 11px 9px; letter-spacing:.14em; white-space:nowrap}
  #browser{grid-template-columns:120px 1fr}
  #browser .list div{padding:6px 10px}
  #browser .banks div{padding:7px 9px}
}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:6px; min-width:0}
.panel > .head{
  display:flex; align-items:center; gap:10px; padding:8px 12px 7px;
  border-bottom:1px solid var(--line); min-height:34px;
}
.panel > .head .ttl{font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim)}
.panel > .head .pick{margin-left:auto; display:flex; gap:6px; min-width:0}
.panel > .head .pick select{max-width:170px}
.panel > .body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:10px}
.fxhead{max-width:1180px; margin-bottom:8px}
.fxbar{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; max-width:1180px}
.fxchip{background:none; border:1px solid var(--line); color:var(--faint); font:inherit; font-size:10px; letter-spacing:.16em; text-transform:uppercase; padding:5px 10px; cursor:pointer; border-radius:3px}
.fxchip:hover{color:var(--txt); border-color:var(--dim)}
.fxchip.on{color:var(--fxc, var(--g)); border-color:var(--fxc, var(--g))}
.fxrack{display:flex; flex-direction:column; gap:8px; max-width:1180px}
.fxrack.rackoff{opacity:.45}
/* a slot after Serum's: the same size for every effect, the name down the left edge, the display filling its half, the controls beside it */
.fxrack > .panel.fxslot{height:214px; margin:0; display:flex; flex-direction:row; overflow:hidden; --kw:52px; --ks:34px}
.fxslot > .head{flex:0 0 116px; flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:10px; padding:12px 10px; border-bottom:0; border-right:1px solid var(--line)}
.fxslot > .head .ttl{letter-spacing:.14em; line-height:1.3; color:var(--fxc, inherit)}
.fxicon{width:76px; height:76px; margin:auto 0 2px 2px; color:var(--fxc, rgba(91,229,132,.82)); opacity:.9; flex:none}
.fxicon *{vector-effect:non-scaling-stroke}
.fxicon .dim{opacity:.42}
.fxslot > .body{flex:1 1 auto; min-width:0; min-height:0; flex-direction:row; align-items:stretch; gap:14px; padding:10px 12px; overflow:hidden}
.fxgfx{flex:0 0 clamp(200px,28%,320px); display:flex; min-width:0}
.fxgfx canvas.gr{flex:1; height:auto !important; min-height:0}
.fxctl{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:8px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--line2) transparent}
.fxrack > .panel.fxslot.nogfx{height:auto; min-height:214px}                          /* no display to keep square: the slot grows with its controls (the EQ's four bands) instead of scrolling */
.fxslot.nogfx .fxctl{overflow:visible}
.fxhead > .body{flex-direction:row; align-items:center; gap:18px}
.fxhead > .body .note{flex:1 1 auto; margin:0}
.fxrack > .panel.fxslot.nogfx{--kw:84px; --ks:50px}                                   /* no display: the controls take the whole width, bigger */
.fxslot.nogfx .fxctl .row{justify-content:space-evenly}
.fxslot.nogfx .fxctl .row > *{margin-top:0}
.fxslot .eqbox{flex-direction:row !important; flex-wrap:wrap; align-items:flex-start; gap:8px 14px !important; width:100%}
.fxslot .eqbox > div:first-child{flex:0 0 clamp(200px,28%,320px)}
.fxslot .eqbox canvas.gr{height:118px !important}
.fxslot .eqbox > .cols{flex:1 1 0; min-width:0; flex-wrap:wrap; gap:8px 10px}
.fxslot .eqbox > .note{flex:0 0 100%}
@media (max-width:900px){
  .fxrack > .panel.fxslot{height:auto; flex-direction:column}
  .fxslot > .head{flex:none; flex-direction:row; align-items:center; border-right:0; border-bottom:1px solid var(--line); padding:8px 12px}
  .fxicon{width:34px; height:34px; margin:0 0 0 auto}
  .fxslot > .body{flex-direction:column; overflow:visible}
  .fxgfx{flex:none; height:90px}
  .fxctl{overflow:visible}
}
.row{display:flex; flex-wrap:wrap; gap:8px 2px; align-items:flex-start}
.row > .fld{margin:6px 6px 0 0}
.row > .tg{margin:14px 8px 0 0}
.sub{font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin:2px 0 -4px}
.cols{display:flex; gap:14px; flex-wrap:wrap}
.cols > *{min-width:0}

/* ---- knob ---- */
.knob{width:var(--kw,60px); text-align:center; flex:none; user-select:none; position:relative}
.knob.inmac::after{content:attr(data-mac); position:absolute; top:-1px; right:3px; font-size:9px; letter-spacing:.04em; color:#0b0c0d; background:var(--g); border-radius:7px; padding:0 4px; line-height:13px; pointer-events:none}
#macmenu{position:fixed; z-index:50; min-width:210px; background:#111415; border:1px solid var(--line2); border-radius:6px; box-shadow:0 8px 28px rgba(0,0,0,.6); padding:6px; font-size:12px}
#macmenu .mh{color:var(--dim); font-size:10px; letter-spacing:.18em; text-transform:uppercase; padding:4px 8px 6px}
#macmenu button{display:flex; width:100%; align-items:center; gap:8px; background:none; border:0; color:var(--txt); font:inherit; text-align:left; padding:5px 8px; border-radius:4px; cursor:pointer}
#macmenu button:hover{background:#1b2023}
#macmenu button .n{flex:0 0 18px; color:var(--g)}
#macmenu button .nm{flex:1; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#macmenu button .tick{color:var(--g)}
#macmenu button.on .nm{color:var(--txt)}
.macgrp{border:1px solid var(--line); border-radius:5px; padding:6px 8px; margin-bottom:8px}
.macgrp .mgh{display:flex; align-items:center; gap:8px; margin-bottom:4px}
.macgrp .mgh .b{color:var(--g); font-size:10px; letter-spacing:.16em}
.macgrp input[type=text]{background:#0b0d0e; border:1px solid var(--line2); color:var(--txt); font:inherit; font-size:12px; padding:3px 6px; border-radius:3px; width:150px}
.macgrp input[type=number]{background:#0b0d0e; border:1px solid var(--line2); color:var(--txt); font:inherit; font-size:12px; padding:3px 4px; border-radius:3px; width:64px}
.macgrp .mr{display:flex; align-items:center; gap:10px; padding:3px 0; font-size:12px}
.macgrp .mr .k{flex:1; color:var(--txt)}
.macgrp .mr .u{color:var(--faint); font-size:10px}
.macgrp button{background:none; border:1px solid var(--line2); color:var(--dim); font:inherit; font-size:11px; padding:2px 8px; border-radius:3px; cursor:pointer}
.macgrp button:hover{color:var(--txt); border-color:var(--dim)}
.knob svg{display:block; margin:0 auto; cursor:ns-resize; touch-action:none; width:var(--ks,40px); height:var(--ks,40px)}
.knob .lab{color:var(--dim); font-size:10px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.knob .val{color:#7e8a82; font-size:10px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:13px}
.knob:hover .val,.knob.live .val{color:var(--g)}
.knob:hover .lab{color:var(--txt)}
.knob .arc{stroke:var(--g)}
.knob.macoff{opacity:.35}
.knob.macoff:hover{opacity:.7}
/* an effect's slot wears its own colour on every control (knobs, switches, menus, tags), so what a control belongs to shows at a glance */
.fxslot[style*="--fxc"]{--g:var(--fxc); --g2:color-mix(in srgb, var(--fxc) 55%, #0b0c0d); --g3:color-mix(in srgb, var(--fxc) 20%, #0b0c0d)}

/* ---- enum controls ---- */
.fld{display:flex; flex-direction:column; gap:3px; min-width:0}
.fld > .lab{color:var(--dim); font-size:10px}
select{
  appearance:none; -webkit-appearance:none; background:#0c0e0f; color:var(--g);
  border:1px solid var(--line2); border-radius:4px; padding:3px 22px 3px 8px; font:inherit; font-size:11px;
  cursor:pointer; min-width:0; text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%; background-size:4px 4px,4px 4px; background-repeat:no-repeat;
}
select:hover{border-color:var(--g2)}
select:focus{outline:none; border-color:var(--g)}
.seg{display:inline-flex; border:1px solid var(--line2); border-radius:4px; overflow:hidden}
.seg button{
  background:none; border:0; border-right:1px solid var(--line2); color:var(--dim); font:inherit; font-size:10px;
  padding:3px 8px; cursor:pointer; white-space:nowrap;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--g3); color:var(--g)}
.pw{
  width:26px; height:14px; border-radius:7px; background:#1a1d1f; border:1px solid var(--line2);
  position:relative; cursor:pointer; flex:none; padding:0;
}
.pw::after{content:""; position:absolute; top:2px; left:2px; width:8px; height:8px; border-radius:50%; background:var(--faint); transition:left .1s,background .1s}
.pw.on{background:var(--g3); border-color:var(--g2)}
.pw.on::after{left:14px; background:var(--g)}
.tg{display:flex; align-items:center; gap:7px; color:var(--dim); font-size:10px}

/* ---- graphs ---- */
canvas.gr{display:block; width:100%; background:#080909; border:1px solid var(--line); border-radius:4px; touch-action:none}
canvas.gr.drag{cursor:crosshair}
.cap{display:flex; justify-content:space-between; color:var(--faint); font-size:9px; letter-spacing:.08em; margin-top:-6px}
.cap b{color:var(--dim); font-weight:500}
.note{color:var(--faint); font-size:10px}
.band.hot .knob .lab{color:var(--g)}
.err{color:#e58a5b; padding:30px; font-size:13px}

/* ---- preset bar and browser ---- */
#pbar{display:none; align-items:center; gap:4px; margin-left:8px}
#pbar.on{display:flex}
#pbar button{
  background:#0c0e0f; border:1px solid var(--line2); color:var(--dim); font:inherit; cursor:pointer;
  height:28px; min-width:28px; border-radius:4px; padding:0 8px;
}
#pbar button:hover{color:var(--g); border-color:var(--g2)}
#pbar .cur{
  display:flex; align-items:baseline; gap:10px; width:min(46vw,460px); height:28px; padding:0 14px;
  background:#0c0e0f; border:1px solid var(--line2); border-radius:4px; cursor:pointer; overflow:hidden; white-space:nowrap;
}
#pbar .cur:hover,#pbar .cur.open{border-color:var(--g2)}
#pbar .cur .bk{color:var(--dim); font-size:10px; letter-spacing:.14em; text-transform:uppercase; align-self:center}
#pbar .cur .nm{color:var(--hi); font-size:13px; overflow:hidden; text-overflow:ellipsis; align-self:center}
#pbar .cnt{color:var(--faint); font-size:10px; font-variant-numeric:tabular-nums; margin-left:6px; min-width:58px}
#browser{
  display:none; position:fixed; z-index:20; left:50%; top:52px; transform:translateX(-50%);
  width:min(900px,calc(100vw - 24px)); height:min(560px,calc(100vh - 80px));
  background:var(--panel); border:1px solid var(--line2); border-radius:8px; box-shadow:0 18px 60px rgba(0,0,0,.7);
  grid-template-columns:200px 1fr; grid-template-rows:auto 1fr; overflow:hidden;
}
#browser.on{display:grid}
#browser .bhead{grid-column:1 / -1; display:flex; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line)}
#browser .bhead input{
  flex:1; background:#0a0c0d; border:1px solid var(--line2); border-radius:4px; color:var(--hi);
  font:inherit; font-size:13px; padding:6px 10px;
}
#browser .bhead input:focus{outline:none; border-color:var(--g)}
#browser .bhead .x{background:none; border:0; color:var(--dim); font-size:16px; cursor:pointer}
#browser .banks{border-right:1px solid var(--line); overflow:auto; padding:6px 0}
#browser .banks div{display:flex; justify-content:space-between; gap:8px; padding:7px 14px; cursor:pointer; color:var(--dim)}
#browser .banks div:hover{color:var(--txt); background:#14171a}
#browser .banks div.on{color:var(--g); background:var(--g3)}
#browser .banks small{color:var(--faint)}
#browser .list{overflow:auto; padding:6px 0}
#browser .list div{display:flex; gap:12px; padding:6px 16px; cursor:pointer; color:var(--txt); white-space:nowrap}
#browser .list div:hover,#browser .list div.sel{background:#14171a}
#browser .list div.cur{color:var(--g)}
#browser .list div.cur::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--g); align-self:center; margin-left:-10px; margin-right:5px}
#browser .list small{color:var(--faint); margin-left:auto; font-size:10px; letter-spacing:.1em; text-transform:uppercase}
#browser .empty{padding:24px; color:var(--faint)}

/* ---- demo mode ---- */
.demo-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0}
.demo-note{color:var(--faint); font-size:11px; margin-bottom:4px}
.demo-stat{color:var(--dim); font-size:12px; margin-top:6px}
.demo-notes{color:var(--faint); font-size:11px; margin-top:8px; white-space:pre-wrap}
.demo-sum{color:var(--hi); margin:6px 0 4px}
.demo-h{color:var(--dim); letter-spacing:.16em; text-transform:uppercase; font-size:10px; margin:14px 0 4px}
.demo-on,.demo-b,.demo-go,.demo-sel,.demo-name{background:#0c0e0f; border:1px solid var(--line2); color:var(--txt); font:inherit; font-size:12px; padding:7px 14px; border-radius:4px}
.demo-on,.demo-b,.demo-go{cursor:pointer}
.demo-on.on{background:var(--g3); border-color:var(--g2); color:var(--hi)}
.demo-b:hover,.demo-on:hover{color:var(--g); border-color:var(--g2)}
.demo-go{background:var(--g3); border-color:var(--g2); color:var(--hi); margin-top:12px; min-width:110px}
.demo-go:disabled,.demo-on:disabled{opacity:.4; cursor:default}
.demo-sel{max-width:100%}
.demo-name{width:100%; color:var(--hi); font-size:13px; padding:6px 10px}
.demo-drop{border:1px dashed var(--line2); border-radius:6px; padding:16px; text-align:center; color:var(--faint); margin:8px 0}
.demo-drop.over{border-color:var(--g); color:var(--g)}

/* ---- the reminder to import pre-upgrade presets again ---- */
#oldnote{display:none; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px; padding:9px 12px; border:1px solid var(--g2); border-radius:6px; background:var(--g3); color:var(--txt); font-size:12px}
#oldnote.on{display:flex}
#oldnote .t{flex:1 1 320px; min-width:0}
#oldnote .t b{color:var(--hi); font-weight:normal}
#oldnote .t small{display:block; color:var(--dim); font-size:11px; margin-top:3px}
#oldnote button{background:#0c0e0f; border:1px solid var(--line2); color:var(--txt); font:inherit; font-size:11px; cursor:pointer; padding:6px 12px; border-radius:4px; white-space:nowrap}
#oldnote button:hover{color:var(--g); border-color:var(--g2)}
/* ---- import dialog ---- */
#browser .bhead .imp{background:#0c0e0f; border:1px solid var(--line2); color:var(--dim); font:inherit; font-size:11px; letter-spacing:.06em; cursor:pointer; height:28px; padding:0 12px; border-radius:4px; white-space:nowrap}
#browser .bhead .imp:hover{color:var(--g); border-color:var(--g2)}
#imp{
  display:none; position:fixed; z-index:30; left:50%; top:48px; transform:translateX(-50%);
  width:min(640px,calc(100vw - 24px)); max-height:calc(100vh - 72px); flex-direction:column;
  background:var(--panel); border:1px solid var(--line2); border-radius:8px; box-shadow:0 18px 60px rgba(0,0,0,.75); overflow:hidden;
}
#imp.on{display:flex}
#imp .imp-head{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); color:var(--hi); letter-spacing:.16em; text-transform:uppercase; font-size:11px}
#imp .imp-head .x{background:none; border:0; color:var(--dim); font-size:16px; cursor:pointer}
#imp .imp-body{padding:14px 16px 18px; overflow:auto; flex:1 1 auto; min-height:0}
#imp .imp-intro{color:var(--dim); font-size:12px; margin-bottom:12px}
#imp .imp-row{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0}
#imp .imp-b,#imp .imp-go{background:#0c0e0f; border:1px solid var(--line2); color:var(--txt); font:inherit; font-size:12px; cursor:pointer; padding:7px 14px; border-radius:4px}
#imp .imp-b:hover{color:var(--g); border-color:var(--g2)}
#imp .imp-go{background:var(--g3); border-color:var(--g2); color:var(--hi); margin-top:12px; min-width:110px}
#imp .imp-go:disabled{opacity:.4; cursor:default}
#imp .imp-drop{border:1px dashed var(--line2); border-radius:6px; padding:16px; text-align:center; color:var(--faint); margin:8px 0}
#imp .imp-drop.over{border-color:var(--g); color:var(--g)}
#imp .imp-sum{color:var(--hi); margin:6px 0 4px}
#imp .imp-h{color:var(--dim); letter-spacing:.16em; text-transform:uppercase; font-size:10px; margin:16px 0 4px}
#imp .imp-note{color:var(--faint); font-size:11px; margin-bottom:4px}
#imp .rep-bank + .rep-bank{border-top:1px solid var(--line); margin-top:16px; padding-top:14px}

<div class="wrap">
  <div id="top"><div class="brand">TINY<i>HOUSE</i></div><div id="pbar"></div><div class="hint" id="hint">connecting…</div></div>
  <div id="oldnote"></div>

<script type="text/plain" id="impworker">
/* The converter's Python runs here, off the page's thread, so the page stays alive while a bank converts. */
var py = null;
function say(id, text) { self.postMessage({ id: id, progress: text }); }
function ensureDir(path) {
  var parts = path.split("/"), cur = "";
  for (var i = 0; i < parts.length - 1; i++) {
    cur += (i ? "/" : "") + parts[i];
    if (cur && !py.FS.analyzePath("/in/" + cur).exists) py.FS.mkdirTree("/in/" + cur);
  }
}
self.onmessage = async function (e) {
  var m = e.data, id = m.id;
  try {
    var out = null, transfer = [];
    if (m.cmd === "init") {
      say(id, "Loading Python (first time only, about 10 MB)…");
      importScripts(m.base + "pyodide.js");
      py = await loadPyodide({ indexURL: m.base });
      say(id, "Loading numpy…");
      await py.loadPackage(["numpy", "zstandard"]);
      py.FS.writeFile("/b.zip", new Uint8Array(m.bundle));
      py.runPython("import zipfile, sys\nzipfile.ZipFile('/b.zip').extractall('/imp')\nsys.path.insert(0, '/imp')\nimport import_web");
      py.FS.mkdirTree("/in");
    } else if (m.cmd === "add") {
      for (var i = 0; i < m.files.length; i++) {
        var f = m.files[i];
        ensureDir(f.path);
        py.FS.writeFile("/in/" + f.path, new Uint8Array(f.buf));
      }
      out = py.runPython("import_web.add_dir('/in')");
    } else if (m.cmd === "addraw") {                       /* files for Serum's Samples / Multisamples layout under /smp (decoded audio is "<name>.dec") */
      for (var j = 0; j < m.files.length; j++) {
        var g = m.files[j], dir = "/smp/" + g.path.split("/").slice(0, -1).join("/");
        py.FS.mkdirTree(dir);
        py.FS.writeFile("/smp/" + g.path, new Uint8Array(g.buf));
      }
    } else if (m.cmd === "packaudio") {                    /* the audio files that came inside packs: [[name, path in Pyodide]] */
      out = JSON.parse(py.runPython("import_web.pack_audio_json()"));
    } else if (m.cmd === "packget") {                      /* one of them, as bytes */
      var pd = py.FS.readFile(m.path), pab = pd.buffer.slice(pd.byteOffset, pd.byteOffset + pd.byteLength);
      out = pab; transfer = [pab];
    } else if (m.cmd === "sfz") {
      py.globals.set("_rels", JSON.stringify(m.rels));
      out = py.runPython("import_web.sfz_audio_json(_rels)");
    } else if (m.cmd === "getsamples") {                  /* the sample sets written since the last call, as files */
      var list = JSON.parse(py.runPython("import_web.new_sample_files_json()")), got = {}, tr = [];
      for (var q = 0; q < list.length; q++) {
        var data = py.FS.readFile(list[q][1]), ab = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
        got[list[q][0]] = ab; tr.push(ab);
        py.FS.unlink(list[q][1]);
      }
      out = got; transfer = tr;
    } else if (m.cmd === "names") {
      out = JSON.parse(py.runPython("import_web.names_json()"));
    } else if (m.cmd === "convert") {
      py.globals.set("_bank", m.bank);
      py.globals.set("_only", m.only ? JSON.stringify(m.only) : "");
      out = py.runPython("import_web.convert_json(_bank, _only)");
    } else if (m.cmd === "reset") {
      py.runPython("import_web.reset()");
    }
    self.postMessage({ id: id, ok: true, result: out }, transfer);
  } catch (err) {
    self.postMessage({ id: id, ok: false, error: String(err && err.message || err).slice(0, 400) });
  }
};
</script>
<script src="/static/schwung-remote-api.js"></script>
<script>
(function () {
"use strict";

var KP = "synth:";
var META = {};            /* key -> chain_params entry */
var VAL = {};             /* key -> number (enums: option index) */
var SUBS = {};            /* key -> [fn(value)] */
var placed = {};
var KNOBS = {};                       /* key -> its knob elements, so the macro marks can follow the routes */
var graphs = [];

/* ------------------------------------------------------------------ dom */
function el(tag, cls, parent, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function svgNode(parent, tag, attrs) {
  var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var a in attrs) n.setAttribute(a, attrs[a]);
  parent.appendChild(n);
  return n;
}

/* ---------------------------------------------------------------- values */
function send(key, v) {
  try { schwungRemote.setParam(KP + key, String(v)); } catch (e) {}
}
function clampTo(m, v) {
  if (!m) return v;
  if (m.type === "int") return Math.max(m.min, Math.min(m.max, Math.round(v)));
  if (m.type === "enum") return Math.max(0, Math.min(m.options.length - 1, Math.round(v)));
  return v;
}
var TOUCH = {};                                       /* when the user last moved each control here: a late echo of an older value must not pull it back */
function setVal(key, v, push) {
  var m = META[key];
  v = clampTo(m, v);
  if (VAL[key] === v) return;
  VAL[key] = v;
  var s = SUBS[key];
  if (s) for (var i = 0; i < s.length; i++) s[i](v);
  redrawSoon();
  if (push) { TOUCH[key] = Date.now(); send(key, v); }
}
function on(key, fn) {
  (SUBS[key] = SUBS[key] || []).push(fn);
  if (VAL[key] !== undefined) fn(VAL[key]);
}
function val(key) {
  var v = VAL[key];
  if (v !== undefined) return v;
  var m = META[key];
  return m && typeof m.default === "number" ? m.default : 0;
}
function incoming(key, s) {
  var m = META[key];
  if (!m) return;
  if (m.type === "enum") {
    var i = m.options.indexOf(s);
    if (i < 0) i = parseInt(s, 10);
    if (!isNaN(i)) setVal(key, i, false);
  } else if (m.type === "int") {
    var n = parseFloat(s);
    if (!isNaN(n)) setVal(key, n, false);
  }
}
function frac(key) {
  var m = META[key];
  if (!m || m.type !== "int") return 0;
  return (val(key) - m.min) / ((m.max - m.min) || 1);
}

/* ---------------------------------------------------- engine mappings
 * Each one mirrors src/dsp/param_map.h, fx.h or engine.cpp, so a readout and a
 * curve say what the engine does. Where the mapping is not mirrored here the
 * control shows its raw pot value. */
var P01 = function (v) { return v / 127; };
var MAP = {
  noteHz: function (v) { return 440 * Math.pow(2, (8 + v - 69) / 12); },             /* potFilterNote */
  attack: function (v) { var x = P01(v); return Math.max(0.003, 0.0005 + 10 * Math.pow(x, 5)); },
  env: function (v) { return Math.pow(10, P01(v) * 4 - 3); },
  eqHz: function (v) { return 20 * Math.pow(1000, P01(v)); },
  eqDb: function (v) { return (v - 64) / 63 * 24; },
  shelfDb: function (v) { return v >= 64 ? (v - 64) / 63 * 12 : (v - 64) / 64 * 12; },
  rate3: function (v) { var x = P01(v); return 20 * x * x * x; },                      /* chorus / flanger / phaser */
  delayMs: function (v) { return Math.pow(1500, P01(v)); },
  revT60: function (v) { return 0.2 * Math.pow(150, P01(v)); },
  glide: function (v) { return 0.001 * Math.pow(2000, P01(v)); },
  wideRate: function (v) { return 0.05 * Math.pow(100, P01(v)); },
  compThresh: function (v) { return -90 + 120 * P01(v); },
  compRatio: function (v) { return Math.pow(100, P01(v)); },
  compKnee: function (v) { return 48 * P01(v); },
  compAtk: function (v) { return 0.1 * Math.pow(1000, P01(v)); },
  compRel: function (v) { return 10 * Math.pow(300, P01(v)); },
  compMakeup: function (v) { return 24 * P01(v); },
  compBandDb: function (v) { return v >= 64 ? (v - 64) / 63 * 24 : (v - 64) / 64 * 24; },
  eqQ: function (type, v) {                                                          /* potEqQ */
    var reso = [0, 10, 25, 40, 50, 60, 75, 90, 100];
    var qBell = [0.10, 0.10, 0.16, 0.58, 1.25, 2.4, 5.5, 10.0, 14.0];
    var qShelf = [0.40, 0.40, 0.44, 0.51, 0.64, 0.79, 1.13, 1.67, 2.10];
    var q = (type === 2 || type === 3) ? qShelf : qBell;
    var r = Math.min(Math.max(v * (100 / 127), 0), 100), i = 0;
    while (i < 7 && r > reso[i + 1]) i++;
    var x = (r - reso[i]) / (reso[i + 1] - reso[i]);
    return Math.exp(Math.log(q[i]) + x * (Math.log(q[i + 1]) - Math.log(q[i])));
  }
};
function fHz(f) { return f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2) + " kHz" : (f >= 100 ? f.toFixed(0) : f.toFixed(1)) + " Hz"; }
function fSec(t) {
  if (t >= 1) return t.toFixed(t >= 10 ? 1 : 2) + " s";
  var m = t * 1000;
  return (m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2)) + " ms";
}
function fMs(m) { return fSec(m / 1000); }
function fDb(x) { return (x > 0.05 ? "+" : "") + x.toFixed(1) + " dB"; }
function cal() { return val("dist_cal") >= 1; }

var FMT = [
  [/^(vca|flt|me[12])_a$/, function (v) { return fSec(MAP.attack(v)); }],
  [/^(vca|flt|me[12])_[dr]$/, function (v) { return fSec(MAP.env(v)); }],
  [/^(flt2?|fxf)_freq$/, function (v) { return fHz(MAP.noteHz(v)); }],
  [/^flt2?_gain$/, function (v) { return fDb(24 * P01(v)); }],
  [/^(eq[ms]?\d|dist_pre)_freq$/, function (v) { return fHz(MAP.eqHz(v)); }],
  [/^(dly2?_(lo|hi)|rev_damp|rev_lo|chor_filt|phas_freq)$/, function (v) { return fHz(MAP.eqHz(v)); }],
  [/^eq[ms]?\d_gain$/, function (v) { return fDb(MAP.eqDb(v)); }],
  [/^(lo|hi)_shelf$/, function (v) { return fDb(MAP.shelfDb(v)); }],
  [/^dly2?_time(r)?$/, function (v) { return fMs(MAP.delayMs(v)); }],
  [/^dly2?_fb$/, function (v) { return Math.round(Math.min(P01(v), 0.97) * 100) + "%"; }],
  [/^(chor|flan|phas)_fb$/, function (v) { return Math.round(0.8 * P01(v) * 100) + "%"; }],
  [/^(chor|flan|phas)_rate$/, function (v) { return MAP.rate3(v).toFixed(2) + " Hz"; }],
  [/^chor_d[12]$/, function (v) { return (30 * P01(v)).toFixed(1) + " ms"; }],
  [/^rev_decay$/, function (v) { return fSec(MAP.revT60(v)); }],
  [/^fx_wrate$/, function (v) { return MAP.wideRate(v).toFixed(2) + " Hz"; }],
  [/^glide$/, function (v) { return fSec(MAP.glide(v)); }],
  [/^comp_thresh\d?$/, function (v) { return fDb(MAP.compThresh(v)); }],
  [/^comp_ratio$/, function (v) { return MAP.compRatio(v).toFixed(1) + ":1"; }],
  [/^comp_knee$/, function (v) { return MAP.compKnee(v).toFixed(0) + " dB"; }],
  [/^comp_attack$/, function (v) { return fMs(MAP.compAtk(v)); }],
  [/^comp_release$/, function (v) { return fMs(MAP.compRel(v)); }],
  [/^comp_makeup$/, function (v) { return fDb(MAP.compMakeup(v)); }],
  [/^comp_gain\d$/, function (v) { return fDb(MAP.compBandDb(v)); }],
  [/^(wt\d|sub|smp)_tune$/, function (v) { return (v > 0 ? "+" : "") + v + " st"; }],
  [/^pb_range$/, function (v) { return v + " st"; }],
  [/^dist_drive$/, function (v) { return cal() ? fDb(-16 + v * 70 / 127) : Math.round(P01(v) * 100) + "%"; }],
  [/^dist_out$/, function (v) { return cal() ? fDb(-36 + v * 48 / 127) : String(v); }],
  [/^dist_level$/, function (v) { return cal() ? fDb((v - 64) * 24 / 64) : String(v); }],
  [/^dist_pre_q$/, function (v) { return (0.3 * Math.pow(10, P01(v))).toFixed(2); }],
  [/^mwidth$/, function (v) { return Math.round(v / 64 * 100) + "%"; }]
];
function fmt(key, v) {
  for (var i = 0; i < FMT.length; i++) if (FMT[i][0].test(key)) return FMT[i][1](v);
  return String(Math.round(v));
}

/* -------------------------------------------------------------- controls */
var A0 = -135, A1 = 135, KR = 15;
function polar(cx, cy, r, deg) {
  var a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function arcPath(cx, cy, r, from, to) {
  var p0 = polar(cx, cy, r, from), p1 = polar(cx, cy, r, to);
  return "M" + p0[0].toFixed(2) + "," + p0[1].toFixed(2) + "A" + r + "," + r + " 0 " +
         (Math.abs(to - from) > 180 ? 1 : 0) + " " + (to > from ? 1 : 0) + " " + p1[0].toFixed(2) + "," + p1[1].toFixed(2);
}

function knob(key, label, into) {
  var m = META[key];
  if (!m || m.type !== "int") return null;
  placed[key] = 1;
  var min = m.min, max = m.max, span = (max - min) || 1;
  var bip = min < 0 || (min === 0 && max === 127 && m.default === 64);
  var def = typeof m.default === "number" ? m.default : min;
  var wrap = el("div", "knob", into);
  wrap.title = m.name + "  (" + key + ")  - drag, wheel, shift for fine, double-click resets, right-click to put it on a macro";
  (KNOBS[key] = KNOBS[key] || []).push(wrap);
  if (!/^mac\d$/.test(key)) wrap.addEventListener("contextmenu", function (e) { e.preventDefault(); macMenu(key, m.name, e.clientX, e.clientY); });
  var svg = svgNode(wrap, "svg", { width: 40, height: 40, viewBox: "0 0 40 40" });
  svgNode(svg, "path", { d: arcPath(20, 20, KR, A0, A1), stroke: "#1f2326", "stroke-width": 3, fill: "none", "stroke-linecap": "round" });
  var arc = svgNode(svg, "path", { "class": "arc", stroke: "#5be584", "stroke-width": 3, fill: "none", "stroke-linecap": "round" });
  var ptr = svgNode(svg, "line", { stroke: "#d9ffe4", "stroke-width": 2, "stroke-linecap": "round" });
  el("div", "lab", wrap, label || m.name);
  var out = el("div", "val", wrap);

  function paint(v) {
    var f = (v - min) / span, deg = A0 + f * (A1 - A0);
    var from = bip ? 0 : A0, to = deg;
    if (bip) from = A0 + ((def - min) / span) * (A1 - A0);
    arc.setAttribute("d", Math.abs(to - from) < 0.5 ? "" : arcPath(20, 20, KR, Math.min(from, to), Math.max(from, to)));
    var a = polar(20, 20, 11, deg), b = polar(20, 20, 4.5, deg);
    ptr.setAttribute("x1", b[0]); ptr.setAttribute("y1", b[1]);
    ptr.setAttribute("x2", a[0]); ptr.setAttribute("y2", a[1]);
    out.textContent = fmt(key, v);
  }
  on(key, paint);
  paint(val(key));
  /* a value readout can depend on another key (the distortion's calibrated law) */
  if (key.indexOf("dist_") === 0 && key !== "dist_cal") on("dist_cal", function () { paint(val(key)); });

  var dragY = 0, dragV = 0, dragging = false;
  function mv(e) {
    if (!dragging) return;
    setVal(key, dragV + (dragY - e.clientY) * (span / 170) / (e.shiftKey ? 5 : 1), true);
    e.preventDefault();
  }
  function end() {
    dragging = false; wrap.classList.remove("live");
    document.removeEventListener("pointermove", mv);
    document.removeEventListener("pointerup", end);
    document.removeEventListener("pointercancel", end);
  }
  svg.addEventListener("pointerdown", function (e) {
    dragging = true; dragY = e.clientY; dragV = val(key); wrap.classList.add("live");
    document.addEventListener("pointermove", mv);
    document.addEventListener("pointerup", end);
    document.addEventListener("pointercancel", end);
    e.preventDefault();
  });
  svg.addEventListener("dblclick", function () { setVal(key, def, true); });
  wrap.addEventListener("wheel", function (e) {
    e.preventDefault();
    var step = e.shiftKey ? 1 : Math.max(1, Math.round(span / 64));
    setVal(key, val(key) + (e.deltaY < 0 ? step : -step), true);
  }, { passive: false });
  return wrap;
}

function isOnOff(m) {
  return m.type === "enum" && m.options.length === 2 && m.options[0] === "Off" && m.options[1] === "On";
}

function toggle(key, into, label) {
  var m = META[key];
  if (!m || m.type !== "enum") return null;
  placed[key] = 1;
  var b = el("button", "pw", into);
  b.title = m.name + "  (" + key + ")";
  b.addEventListener("click", function () { setVal(key, val(key) >= 1 ? 0 : 1, true); });
  on(key, function (v) { b.classList.toggle("on", v >= 1); });
  b.classList.toggle("on", val(key) >= 1);
  if (!label) return b;
  var w = el("label", "tg", into);
  w.appendChild(b);
  el("span", null, w, label);
  return w;
}

function choice(key, label, into) {
  var m = META[key];
  if (!m || m.type !== "enum") return null;
  if (isOnOff(m)) return toggle(key, into, label || m.name);
  placed[key] = 1;
  var f = el("div", "fld", into);
  f.title = m.name + "  (" + key + ")";
  if (label) el("div", "lab", f, label);
  if (m.options.length <= 5) {
    var seg = el("div", "seg", f), bs = [];
    m.options.forEach(function (o, i) {
      var b = el("button", null, seg, o);
      b.addEventListener("click", function () { setVal(key, i, true); });
      bs.push(b);
    });
    var paint = function (v) { bs.forEach(function (b, i) { b.classList.toggle("on", i === v); }); };
    on(key, paint); paint(val(key));
  } else {
    var sel = el("select", null, f);
    m.options.forEach(function (o, i) { var op = el("option", null, sel, o); op.value = String(i); });
    sel.addEventListener("change", function () { setVal(key, parseInt(sel.value, 10), true); });
    on(key, function (v) { sel.value = String(v); });
    sel.value = String(val(key));
  }
  return f;
}

/* a row of controls: "key" or ["key", "Label"] */
function row(specs, into) {
  var r = el("div", "row", into);
  specs.forEach(function (s) {
    var key = typeof s === "string" ? s : s[0], label = typeof s === "string" ? null : s[1];
    var m = META[key];
    if (!m) return;
    if (m.type === "int") knob(key, label, r);
    else if (m.type === "enum") choice(key, label, r);
  });
  return r;
}

function panel(title, into, o) {
  o = o || {};
  var p = el("div", "panel" + (o.cls ? " " + o.cls : ""), into);
  var head = el("div", "head", p);
  if (o.power && META[o.power]) toggle(o.power, head);
  el("div", "ttl", head, title);
  var body = el("div", "body", p);
  return { root: p, head: head, body: body };
}

/* --------------------------------------------------------------- graphs */
var pending = false;
function redrawSoon() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(function () { pending = false; drawAll(); });
}
function drawAll() {
  graphs.forEach(function (o) {
    var c = o.c, w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;                         /* on a hidden tab */
    var dpr = window.devicePixelRatio || 1;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    var g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    o.draw(g, w, h);
  });
}
window.addEventListener("resize", redrawSoon);

/* draw(g, w, h); ptr = { down(x,y)->bool, move(x,y), up() } for a draggable graph */
function graph(into, draw, h, ptr) {
  var c = el("canvas", "gr" + (ptr ? " drag" : ""), into);
  c.style.height = h + "px";
  graphs.push({ c: c, draw: draw });

    g.strokeRect(Math.round(ls * w) + .5, wavH - 6.5, Math.max(2, Math.round((le - ls) * w)), 6);
    label(g, "LOOP", ls * w + 3, wavH - 9);
  }
  /* the scan head */
  var head = headAt(t), hx = Math.round(head * w);
  g.fillStyle = "rgb(" + GREEN + ")"; g.fillRect(hx, 0, 1.5, wavH + 6);
  g.beginPath(); g.moveTo(hx - 4, 0); g.lineTo(hx + 5, 0); g.lineTo(hx + .5, 6); g.closePath(); g.fill();

  /* the grain lane */
  g.fillStyle = "rgba(255,255,255,.035)"; g.fillRect(0, laneTop, w, laneH);
  var alive = 0, widthPx = Math.max(2, Math.min(w * 0.7, lenSec / GRAIN_FILE_S * w));
  if (kd > 0 && kl > 0) {
    var born = N / Math.max(lenSec, 0.001);                                       /* births per second: N alive at a time */
    var kNow = Math.floor(t * born), kFirst = Math.max(0, kNow - Math.ceil(N) - 1);
    for (var k = kNow; k >= kFirst && alive < 48; k--) {
      var age = (t - k / born) / Math.max(lenSec, 0.001);
      if (age < 0 || age >= 1) continue;
      var pos = headAt(k / born) + (grainRand(k) - 0.5) * 2 * rOff * 0.5;          /* Random Offset scatters the read position */
      var amp = 1 - rGain * grainRand(k + 7919) * 0.9;                              /* Random Gain thins some of them */
      var gx = pos * w, ww = widthPx, ctop = laneTop + laneH;
      g.beginPath(); g.moveTo(gx, ctop);
      for (var q = 0; q <= 20; q++) g.lineTo(gx + ww * q / 20, ctop - laneH * 0.92 * amp * grainWin(shape, wparam, wskew, q / 20));
      g.lineTo(gx + ww, ctop); g.closePath();
      g.fillStyle = "rgba(" + GREEN + "," + (0.10 + 0.30 * (1 - age)).toFixed(3) + ")"; g.fill();
      g.strokeStyle = "rgba(" + GREEN + ",.35)"; g.lineWidth = 1; g.stroke();
      var dx = gx + ww * age, dy = ctop - laneH * 0.92 * amp * grainWin(shape, wparam, wskew, age);
      g.fillStyle = "rgba(217,255,228,.95)"; g.fillRect(dx - 1, dy - 1, 3, 3);          /* where this grain is in its own window now */
      alive++;
    }
  }
  /* the numbers behind it */
  var ms = lenSec * 1000;
  label(g, alive + " grains alive  ·  " + N.toFixed(1) + " overlap  ·  length " + (ms < 1000 ? ms.toFixed(ms < 10 ? 1 : 0) + " ms" : (ms / 1000).toFixed(2) + " s") + "  ·  scan " + (scan > 0 ? "+" : "") + scan + " %" + (man ? "  ·  manual position" : ""), 6, h - 5);
  label(g, "an illustration of the settings, not the audio · drag to set Start", w - 6, h - 5, "right");
}

/* ---- preset browser -------------------------------------------------------
 * The module publishes every bank with its preset names (preset_list) and the one the Move is on
 * (preset_now, "bank,index"). Loading is the module's own: "bank" switches the bank and plays its
 * first sound, "preset" is the index inside the bank. A load changes hundreds of values at once and
 * the host only streams values it is told changed, so after a load the panel asks the host to
 * resubscribe and reads everything again. */
var PS = { banks: [], b: 0, i: 0, shown: [], sel: 0, q: "", viewBank: 0 };
var pbarEl = null, brEl = null, brSearch = null, brBanks = null, brList = null, curEl = null, cntEl = null;

function psFlat() {
  var n = 0;
  for (var b = 0; b < PS.b; b++) n += PS.banks[b].p.length;
  return n + PS.i;
}
function psTotal() { return PS.banks.reduce(function (s, b) { return s + b.p.length; }, 0); }
function psName() {
  var b = PS.banks[PS.b];
  return b && b.p[PS.i] !== undefined ? b.p[PS.i] : "";
}

var reloadTimer = null;
function reseed() {
  Object.keys(META).forEach(function (k) {
    if (META[k].type === "filepath") return;
    schwungRemote.getParam(KP + k).then(function (v) { if (v !== undefined && v !== null && v !== "") incoming(k, v); }).catch(function () {});
  });
}
function afterLoad() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(function () {
    if (schwungRemote.resubscribe) { try { schwungRemote.resubscribe(); } catch (e) {} }
    setTimeout(reseed, 700);
  }, 500);
}
function loadPreset(b, i) {
  if (!PS.banks[b] || PS.banks[b].p[i] === undefined) return;
  if (b !== PS.b) {
    send("bank", b);                       /* switches the bank and plays its first sound */
    PS.b = b; PS.i = 0;
    if (i !== 0) setTimeout(function () { send("preset", i); }, 150);
    else send("preset", 0);
  } else send("preset", i);
  PS.i = i;
  renderPbar(); renderBrowser();
  afterLoad();
}
function stepPreset(d) {
  var tot = psTotal();
  if (!tot) return;
  var f = ((psFlat() + d) % tot + tot) % tot;
  for (var b = 0; b < PS.banks.length; b++) {
    if (f < PS.banks[b].p.length) { loadPreset(b, f); return; }
    f -= PS.banks[b].p.length;
  }

/* ---- the report ---- */
/* What one preset has that did not come across, one line each. */
function impAllLines(p) {
  var out = p.gaps.map(function (g) { return g; });
  p.not_carried.forEach(function (g) { out.push(/not carried|not imported/.test(g) ? g : g + " not carried"); });
  p.missing_tables.forEach(function (t) { out.push("Wavetable not found: " + t + " (the Init table plays instead)"); });
  p.missing_samples.forEach(function (t) {
    var own = !/(^|\/)Packs\//i.test(t);          /* a file of Serum's own library, which a pack leaves out because every Serum owner has it */
    out.push("Sample not found: " + t + (IMP.smps.length ? " (that oscillator stays silent" + (own ? "; it is one of Serum's own sample files and was not found in the folder you chose" : "") + ")"
      : " (" + (own ? "a file of Serum's own library, not in the pack: " : "") + "no Samples folder has been chosen: pick your Serum 2 folder, not only its Presets folder, then import again; that oscillator stays silent)"));
  });
  return out;
}
function impLines(p) {
  var out = impAllLines(p);
  return out.filter(function (l) { return !impIsSmall(p, l); });           /* a Vital preset nearly always has a few small details the engine does not carry, and a Serum preset may lack a Bode: they are not counted as gaps, but they are listed (see impMinorLines) */
}
/* The small details of a Vital preset that did not come across: kept out of the gap counts, listed in their own closed group so nothing is dropped without a word. */
function impMinorLines(p) { return impAllLines(p).filter(function (l) { return impIsSmall(p, l); }); }
/* A Serum preset's Bode (a frequency shifter the engine has no stage for) is a small detail too: the importer scripts import a preset without it and list it, because Serum's own render rarely changes much without it. */
function impIsBode(l) { return /\bBode\b/.test(l) && !/Split/.test(l); }

/* Small details of a Vital preset: a modulation route, a modulator's delay or shape, a filter's drive or key tracking, a filter's partial mix, the amp envelope's delay. The sound is close without them. */
function impIsMinor(l) {

}
/* A gap in the sound itself (an oscillator that is silent or plays the wrong table) as against an effect left out. */
function impIsSound(l) { return /^SILENT|^Oscillator|^Sample not found|^Wavetable not found|oscillators are not imported|sample was not carried/.test(l); }

  var bad = list.filter(function (p) { return !p.json || !sent[p.file]; });
  var lines = impLines;
  var whole = ok.filter(function (p) { return !lines(p).length; });
  var part = ok.filter(function (p) { return lines(p).length; });
  part.sort(function (a, b) { return impSound(b) - impSound(a); });          /* the presets whose sound is changed come first */
  var head = el("div", "rep-head", body);
  el("b", null, head, "Imported " + ok.length + " of " + list.length + (list.length === 1 ? " preset" : " presets"));
  head.appendChild(document.createTextNode(" into the bank “" + bank + "”" + (existed ? " (presets with the same name were replaced)" : "") + "."));
  if (!landed && ok.length) el("div", "rep-warn", body, "The Move has not listed them yet. Reload the slot, or press the Move's preset browser once, and they will appear in the bank “" + bank + "”.");
  var tally = {};

  var tk = Object.keys(tally).sort(function (a, b) { return tally[b] - tally[a]; }).slice(0, 6);

  });
}
function macFollow(i) {
  clearTimeout(MAC.timer);
  /* Once the macro has been still a moment the page's sum is written back to the module, so the module, the host's copy and the display all hold the same number. (The host's own copy of a
   * control a macro moved is only ever an old reading, partway through the sweep, so it is never read back; and the module moves by every small step where the page sees fewer, so the two can
   * differ by a little at a limit until this write-back.) */
  MAC.timer = setTimeout(function () {
    macKeys(i).forEach(function (k) {
      var p = MACP.pred[k];
      delete MACP.before[k];
      delete MACP.pred[k];
      if (p === undefined) return;
      setVal(k, p, false);
      send(k, val(k));
    });
  }, 350);
}
function macReload() {
  MACP.hold = Date.now() + 1500;                      /* a preset has just loaded: its macro values are not moves */
  schwungRemote.getParam(KP + "macro_names").then(function (v) { EXTRA.macro_names(v || ""); }).catch(function () {});
  schwungRemote.getParam(KP + "macro_routes").then(function (v) { EXTRA.macro_routes(v || ""); }).catch(function () {});
}
function buildMacros(page) {
  var g = el("div", "grid g2", page);
  var p = panel("Macros", g);
  /* two rows of four, as on the Move: 1-4 on top, 5-8 below */
  var r1 = row(["mac1", "mac2", "mac3", "mac4"], p.body), r2 = row(["mac5", "mac6", "mac7", "mac8"], p.body);
  var wraps = Array.prototype.slice.call(r1.querySelectorAll(".knob")).concat(Array.prototype.slice.call(r2.querySelectorAll(".knob")));
  for (var i = 0; i < wraps.length; i++) {
    MAC.wraps[i] = wraps[i]; MAC.labs[i] = wraps[i].querySelector(".lab");
    (function (n) { on("mac" + (n + 1), function (v) { macPredict(n, v); macFollow(n); }); })(i);
  }
  MAC.note = el("div", "demo-note", p.body, "This sound has no macros yet. Right-click any knob (on any tab) and choose a macro to put it there: the macro then moves that control, and the Move shows it as one of its eight macro knobs. Imported Serum presets bring their own.");
  macRender();
  var ap = panel("Assignments", g);
  el("div", "demo-note", ap.body, "Right-click a knob to add it to a macro or take it off. A new assignment lets the macro sweep the control across its whole range, up as the macro goes up; here you set how far each control travels as the macro goes from 0 to 127 (a negative number runs it the other way), name the macro, or clear it. Knobs that sit on a macro show a small M tag.");
  MAC.list = el("div", null, ap.body);
  MAC.empty = el("div", "demo-note", ap.body, "Nothing is assigned yet.");
  macList();
}
function buildDemo(page) {
  var u = DM.ui = {};
  var g = el("div", "grid g2", page);
  var card = panel("Demo", g).body;
  el("div", "demo-note", card, "Play a part of an uploaded song on this slot. Put bass on one slot and a lead on another and switch them on to hear the whole track. Switching on does not start the Move's transport: the part is ready and joins at the next bar when you press Play, then follows the transport, stopping and starting with it.");
  var row = el("div", "demo-row", card);
  u.on = el("button", "demo-on", row, "Demo off");
  u.on.addEventListener("click", function () { DM.on = !DM.on; demoSend("demo_on", DM.on ? "On" : "Off"); demoRender(); });
  u.pack = el("select", "demo-sel", row);
  u.pack.addEventListener("change", function () { DM.b = +u.pack.value; DM.p = 0; demoSend("demo_pack", DM.b); demoRender(); });
  u.part = el("select", "demo-sel", row);
  u.part.addEventListener("change", function () { DM.p = +u.part.value; demoSend("demo_part", DM.p); });
  u.stat = el("div", "demo-stat", card, "");

  var imp = panel("Import MIDI", g).body;
  el("div", "demo-note", imp, "Choose .mid files, or a folder of them (a Serum pack's demo MIDI). Each track becomes a part you can pick above. They play at the Move's tempo.");
  var r2 = el("div", "demo-row", imp);
  function picker(label, attrs) {
    var inp = el("input", null, imp); inp.type = "file"; inp.style.display = "none";
    for (var a in attrs) inp.setAttribute(a, attrs[a]);
    inp.addEventListener("change", function () { demoAdd(pickList(inp)); inp.value = ""; });
    var b = el("button", "demo-b", r2, label);
    b.addEventListener("click", function () { inp.click(); });
  }
  picker("MIDI files…", { multiple: "", accept: ".mid,.midi" });
  picker("Folder…", { webkitdirectory: "", directory: "" });
  var drop = el("div", "demo-drop", imp, "…or drop MIDI files or folders here");
  drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
  drop.addEventListener("drop", function (e) {
    e.preventDefault(); drop.classList.remove("over");
    var items = e.dataTransfer && e.dataTransfer.items, out = [], jobs = [];
    if (items && items.length && items[0].webkitGetAsEntry) {
      for (var i = 0; i < items.length; i++) { var en = items[i].webkitGetAsEntry(); if (en) jobs.push(walkEntry(en, "", out)); }
      Promise.all(jobs).then(function () { demoAdd(out); });
    } else if (e.dataTransfer) {
      for (var j = 0; j < e.dataTransfer.files.length; j++) out.push({ file: e.dataTransfer.files[j], rel: e.dataTransfer.files[j].name });
      demoAdd(out);
    }
  });
  u.sum = el("div", "demo-sum", imp, "");
  el("div", "demo-h", imp, "Pack name");
  u.name = el("input", "demo-name", imp); u.name.type = "text"; u.name.maxLength = 40; u.name.value = "Demos";
  u.name.addEventListener("input", function () { u.nameTouched = true; });
  u.go = el("button", "demo-go", imp, "Import");
  u.go.addEventListener("click", demoRun);
  u.res = el("div", "demo-stat", imp, "");
  u.notes = el("div", "demo-notes", imp, "");
  demoSummary(); demoRender();
  /* while the demo is on, ask the module whether it has started (it waits for a bar) */
  setInterval(function () {
    if (!DM.on) return;
    schwungRemote.getParam(KP + "demo_now").then(function (v) { if (v) EXTRA.demo_now(v); }).catch(function () {});
  }, 1000);
}

/* chain_params entries the module adds for the host's own pages (pack and table lists, the preset
 * browser): they are not sound parameters and have their own pickers or none here */
var NOT_CONTROLS = /^(wt_pack|wt\d_select|preset|bank|rescan|is_loading|wt_paths|demo_on|demo_pack|demo_part|demo_list|demo_now|mac[1-8]|macro_names|macro_routes)$/;

/* keys the host streams that are not controls */
var EXTRA = {
  /* The parameters the host wrote lately ("key=value;key=value"): the Move's clip automation moves a knob by writing it, which the manager never announces. Read on its 500 ms beat. */
  live_vals: function (v) {
    String(v || "").split(";").forEach(function (kv) {
      var i = kv.indexOf("="); if (i < 1) return;
      var k = kv.substring(0, i);
      if (Date.now() - (TOUCH[k] || 0) < 1500) return;
      if (META[k] && META[k].type !== "filepath") incoming(k, kv.substring(i + 1));
    });
  },
  wt_paths: function (v) { try { var a = JSON.parse(v); if (a && a.length) PATHS = a; } catch (e) {} },
  wt1_shape: function (v) { ingestShape(1, v); },
  wt2_shape: function (v) { ingestShape(2, v); },
  wt3_shape: function (v) { ingestShape(3, v); },
  preset_list: function (v) {
    try { var d = JSON.parse(v); if (d && d.b) { PS.banks = d.b; renderPbar(); renderBrowser(); renderOldNote(); } } catch (e) {}
  },
  demo_list: function (v) {
    try { var d = JSON.parse(v); if (d && d.b) { DM.packs = d.b; demoRender(); } } catch (e) {}
  },
  demo_now: function (v) {
    var p = String(v).split(","), b = parseInt(p[0], 10), i = parseInt(p[1], 10);
    if (!isNaN(b) && !isNaN(i)) { DM.b = b; DM.p = i; DM.playing = p[2] === "1"; demoRender(); }
  },
  demo_on: function (v) { DM.on = String(v).toLowerCase() === "on" || String(v) === "1"; demoRender(); },
  macro_names: function (v) { MAC.names = String(v || "").split("|"); macRender(); macList(); },
  macro_routes: function (v) {
    MAC.routes = String(v || "").split(",").map(function (t) { var a = t.split(":"); return { m: parseInt(a[0], 10), k: a[1], t: parseFloat(a[2]) || 0 }; }).filter(function (r) { return r.k; });
    macMarks(); macList();
  },
  preset_now: function (v) {
    var p = String(v).split(","), b = parseInt(p[0], 10), i = parseInt(p[1], 10);
    if (!isNaN(b) && !isNaN(i)) { PS.b = b; PS.i = i; renderPbar(); renderBrowser(); macReload(); wtPathsSoon(); }
  }
};
/* the list of wavetable files can change with a preset (a preset names a pack of its own), and the manager's state push no longer carries it:
 * read it once when the browsing has rested, not on every detent */
var wtPathsTimer = null;
function wtPathsSoon() {
  if (wtPathsTimer) clearTimeout(wtPathsTimer);
  wtPathsTimer = setTimeout(function () {
    wtPathsTimer = null;
    schwungRemote.getParam(KP + "wt_paths").then(function (v) { if (v) EXTRA.wt_paths(v); }).catch(function () {});
  }, 700);
}
[1, 2, 3].forEach(function (n) {
  EXTRA["wt" + n + "_table"] = function (p) { if (p) loadShapeFromFile(n, p); };
});

/* ------------------------------------------------------------------ start */
function buildTabs() {
  var tabs = document.getElementById("tabs"), pages = document.getElementById("pages");
  var defs = [["Osc", null], ["Sample", buildSample], ["Macros", buildMacros], ["Filter", buildFilter], ["Envelopes", buildEnv], ["FX", buildFx], ["Mix", buildMix], ["Globals", buildGlobal], ["Demo", buildDemo]];
  var ps = [], bs = [];
  defs.forEach(function (d, i) {
    var b = el("button", i ? null : "on", tabs, d[0]);
    var p = d[1] ? el("div", "page", pages) : null;            /* the Osc tab has no page of its own: it shows the oscillator panels */
    if (p) d[1](p);
    ps.push(p); bs.push(b);
    b.addEventListener("click", function () {
      ps.forEach(function (x, j) { if (x) x.classList.toggle("on", j === i); bs[j].classList.toggle("on", j === i); });
      document.getElementById("osc").style.display = i === 0 ? "" : "none";
      var os = document.querySelector(".seg.oscsel"); if (os) os.style.display = i === 0 ? "" : "none";
      SMPUI.onOsc = i === 0; if (SMPUI.noteShow) SMPUI.noteShow();
      try { localStorage.setItem("th_tab2", String(i)); } catch (e) {}
      redrawSoon();
    });
  });
  try {
    var t = parseInt(localStorage.getItem("th_tab2"), 10);
    if (t > 0 && t < defs.length) bs[t].click();
  } catch (e) {}
}

function start(cp) {
  cp.forEach(function (c) { if (c && c.key) META[c.key] = c; });
  buildBrowser();
  buildImport();
  buildOsc();
  buildTabs();
  buildPickers(cp);
  document.getElementById("hint").textContent = Object.keys(META).length + " parameters · live both ways";
  drawAll();

  schwungRemote.onParamChange(function (p) {
    for (var key in p) {
      if (key.indexOf(KP) !== 0) continue;
      var k = key.substring(KP.length);
      if (EXTRA[k]) EXTRA[k](p[key]);
      else if (META[k] && META[k].type !== "filepath") incoming(k, p[key]);
    }
  });
  /* seed from the host's cache, in case the first push was missed */
  Object.keys(META).forEach(function (k) {
    if (META[k].type === "filepath") return;
    schwungRemote.getParam(KP + k).then(function (v) { if (v !== undefined && v !== null && v !== "") incoming(k, v); }).catch(function () {});
  });
  Object.keys(EXTRA).forEach(function (k) {
    schwungRemote.getParam(KP + k).then(function (v) { if (v) EXTRA[k](v); }).catch(function () {});
  });
}

function fail(msg) {
  var e = el("div", "err", document.body, msg);
  document.getElementById("hint").textContent = "not connected";
}

if (!window.schwungRemote || !schwungRemote.getChainParams) fail("The Schwung remote API is not available on this page.");
else schwungRemote.getChainParams().then(start).catch(function () { fail("Could not read the module's parameters."); });
})();
</script>
